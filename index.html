<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07050a">
<title>DHIKRVERSE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== COLORS ===== */
:root{--gold:#e8bb5c;--gold2:#c98a1e;--gold3:#fbe9b8;--rose:#d0687c;--bg:#06040a;--line:rgba(232,187,92,.22);--text:#f6ecdb;--mute:#b5a58c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%;overscroll-behavior-x:none}
body{background:var(--bg);color:var(--text);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.7;overflow-x:hidden;max-width:100%;min-height:100vh;touch-action:pan-y}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 50% -8%,rgba(232,187,92,.28),transparent 70%),radial-gradient(45% 35% at 105% 40%,rgba(208,104,124,.2),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;background-image:linear-gradient(rgba(232,187,92,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(232,187,92,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent 75%)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.fxw{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aur{position:absolute;z-index:0;pointer-events:none;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}
.aur.a1{width:55vw;height:55vw;left:-15vw;top:5vh;background:rgba(232,187,92,.28);animation:dr1 16s ease-in-out infinite alternate}
.aur.a2{width:50vw;height:50vw;right:-15vw;top:40vh;background:rgba(208,104,124,.3);animation:dr2 19s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(12vw,14vh) scale(1.2)}}
@keyframes dr2{to{transform:translate(-14vw,-10vh) scale(1.15)}}
.glow{position:absolute;left:0;top:0;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle,rgba(232,187,92,.16),transparent 65%);will-change:transform;opacity:0;transition:opacity .4s}
.z{position:relative;z-index:1}
@keyframes up{from{opacity:0;transform:translateY(30px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.in{opacity:0;animation:up 1s cubic-bezier(.2,.8,.2,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}.d5{animation-delay:.65s}

.bar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:rgba(6,4,10,.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line)}
.logo{font-family:Outfit;font-weight:700;letter-spacing:.36em;direction:ltr;font-size:1.05rem;background:linear-gradient(100deg,var(--gold),var(--gold3),var(--rose),var(--gold));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite}
.pill{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 18px;font:500 .85rem 'Readex Pro';cursor:pointer;transition:.25s}
.pill:hover,.pill:focus-visible{border-color:var(--gold);box-shadow:0 0 24px rgba(232,187,92,.35);outline:none}

.hero{overflow:clip;--mx:0;--my:0;max-width:1140px;margin:auto;padding:70px 24px 30px;display:grid;grid-template-columns:1fr 1.05fr;gap:20px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:6px 18px;font-size:.82rem;color:var(--gold3);margin-bottom:22px;background:linear-gradient(135deg,rgba(232,187,92,.16),rgba(232,187,92,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pu 2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(232,187,92,.8)}70%,100%{box-shadow:0 0 0 10px rgba(232,187,92,0)}}
h1{font-weight:600;font-size:clamp(2.3rem,5.8vw,4.1rem);line-height:1.25;letter-spacing:-.01em;background:linear-gradient(100deg,var(--gold),var(--gold3) 30%,var(--rose) 60%,var(--gold) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up 1s .2s cubic-bezier(.2,.8,.2,1) both,gs 7s linear infinite;filter:drop-shadow(0 4px 34px rgba(232,187,92,.3))}
@keyframes gs{to{background-position:-250% 0}}
.sub{color:var(--mute);font-weight:300;margin:20px 0 38px;max-width:29em;font-size:1.08rem}

.dl{position:relative;display:inline-flex;align-items:center;gap:14px;padding:21px 50px;border-radius:999px;border:1px solid #fbe3a3;background:linear-gradient(180deg,#fbdf94 0%,#e8ae3c 55%,#c98a1e 100%);color:#1c1105;font:600 1.2rem 'Readex Pro';cursor:pointer;isolation:isolate;box-shadow:0 0 0 6px rgba(232,187,92,.1),0 14px 50px rgba(232,170,60,.5),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(120,70,0,.25);transition:transform .25s,box-shadow .25s;will-change:transform;--p:0%}
.dl::before{content:"";position:absolute;inset:-2px;border-radius:inherit;z-index:-1;border:2px solid var(--gold);animation:rp 2.6s infinite}
@keyframes rp{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.28,1.55);opacity:0}}
.dl::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;border-radius:inherit;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:sh 3.4s infinite}
@keyframes sh{0%,55%{left:-70%}100%{left:150%}}
.dl .fill{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:-1}
.dl .fill::after{content:"";position:absolute;inset:0;width:var(--p);background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.55));transition:width .2s}
.dl:hover,.dl:focus-visible{box-shadow:0 0 0 9px rgba(232,187,92,.16),0 22px 80px rgba(232,170,60,.7),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -3px 0 rgba(120,70,0,.25);outline:none}
.dl:active{scale:.97}
.dl.busy{pointer-events:none}
.dl svg{width:24px;height:24px;animation:bn 1.8s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(3px)}}
.meta{margin-top:22px;font-size:.86rem;color:var(--mute);letter-spacing:.02em}

.phones{position:relative;height:610px;direction:ltr;perspective:1300px}
.orb{position:absolute;left:50%;top:48%;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;background:radial-gradient(circle,rgba(232,187,92,.45),rgba(208,104,124,.18) 45%,transparent 70%);filter:blur(26px);animation:ob 7s ease-in-out infinite}
@keyframes ob{50%{transform:scale(1.16);opacity:.8}}
.ringx{position:absolute;left:50%;top:48%;border-radius:50%;border:1px solid var(--line);transform:translate(-50%,-50%)}
.ringx.r1{width:400px;height:400px;animation:spin 32s linear infinite;border-style:dashed}
.ringx.r1::after{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--gold3);box-shadow:0 0 16px 4px var(--gold)}
.ringx.r2{width:540px;height:540px;opacity:.5;animation:spin 60s linear infinite reverse}
.ringx.r2::after{content:"";position:absolute;right:-4px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--rose);box-shadow:0 0 14px 3px var(--rose)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ph{position:absolute;width:214px;border-radius:34px;padding:5px;background:linear-gradient(145deg,#f7dc96,#7a5316 40%,#e8bb5c 70%,#5a3b0c);box-shadow:0 30px 80px rgba(0,0,0,.85);transition:transform .2s ease-out}
.ph img{display:block;width:100%;border-radius:30px;background:#000}
.ph::after{content:"";position:absolute;inset:5px;border-radius:30px;background:linear-gradient(120deg,rgba(255,255,255,.2),transparent 38%);pointer-events:none}
.ph.a{left:1%;top:100px;transform:rotate(-8deg) rotateY(calc(var(--mx)*-14deg)) rotateX(calc(var(--my)*10deg)) translateX(calc(var(--mx)*-14px))}
.ph.b{left:50%;margin-left:-126px;top:12px;width:252px;z-index:2;box-shadow:0 30px 120px rgba(232,187,92,.42),0 30px 80px rgba(0,0,0,.85);animation:fl 6s ease-in-out infinite;transform:rotateY(calc(var(--mx)*16deg)) rotateX(calc(var(--my)*-12deg)) translateX(calc(var(--mx)*20px))}
.ph.c{right:1%;top:124px;transform:rotate(8deg) rotateY(calc(var(--mx)*-14deg)) rotateX(calc(var(--my)*10deg)) translateX(calc(var(--mx)*-14px))}
@keyframes fl{50%{margin-top:-16px}}

.wrap{overflow-x:clip;max-width:1140px;margin:auto;padding:60px 24px 30px}
h2{display:flex;align-items:center;gap:18px;font-size:1.5rem;font-weight:600;color:var(--gold3);margin-bottom:12px}
h2::before,h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.sc{touch-action:pan-x pan-y;overscroll-behavior-x:contain;display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px 10px 40px;direction:ltr;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.sc::-webkit-scrollbar{display:none}
.sc figure{flex:none;width:240px;scroll-snap-align:center;text-align:center;opacity:0;translate:0 50px;transition:opacity .8s,translate .8s cubic-bezier(.2,.8,.2,1),transform .25s ease-out;transform:perspective(800px) translateY(var(--ty,0)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));--ty:0px}
.sc figure.show{opacity:1;translate:0 0}
.sc figure:hover{--ty:-14px}
.sc img{width:100%;display:block;border-radius:32px;border:5px solid transparent;background:linear-gradient(#000,#000) padding-box,linear-gradient(145deg,#f7dc96,#7a5316 40%,#e8bb5c 70%,#5a3b0c) border-box;box-shadow:0 22px 60px rgba(0,0,0,.7);transition:box-shadow .35s}
.sc figure:hover img{box-shadow:0 28px 90px rgba(232,187,92,.45)}
.sc figcaption{display:inline-block;margin-top:18px;padding:4px 20px;border:1px solid var(--line);border-radius:999px;font-size:.86rem;color:var(--gold3);background:rgba(232,187,92,.08)}

/* ===== WHAT'S NEW (2.0) ===== */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chips .badge{margin:0}
.newver{position:relative;display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--gold3);padding:6px 18px 6px 7px;border-radius:999px;font-weight:500;font-size:.92rem;background:linear-gradient(135deg,rgba(232,187,92,.22),rgba(208,104,124,.18));border:1px solid rgba(232,187,92,.6);box-shadow:0 0 34px rgba(232,187,92,.3);overflow:hidden;transition:.25s}
.newver:hover{box-shadow:0 0 50px rgba(232,187,92,.6);transform:translateY(-2px)}
.newver b{background:linear-gradient(135deg,#fbdf94,#e8ae3c);color:#1c1105;border-radius:999px;padding:1px 12px;font:700 .72rem Outfit;letter-spacing:.14em}
.newver::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sh 3.4s infinite}
#new{scroll-margin-top:80px}
.v2{font-family:Outfit;font-weight:700;background:linear-gradient(100deg,var(--gold),var(--gold3),var(--rose),var(--gold));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite}
.bento{display:grid;gap:20px;padding-top:18px;grid-template-columns:repeat(3,1fr);grid-template-areas:"qibla alert dua" "qibla backup dua"}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:30px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(232,187,92,.1),rgba(255,255,255,.02) 40%,rgba(208,104,124,.07));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden;opacity:0;translate:0 50px;transition:opacity .8s,translate .8s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s,transform .3s}
.card.show{opacity:1;translate:0 0}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px circle at var(--gx,50%) var(--gy,0%),rgba(232,187,92,.24),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{border-color:rgba(232,187,92,.65);box-shadow:0 22px 80px rgba(232,187,92,.22);transform:translateY(-6px)}
.card:hover::before{opacity:1}
.card.qibla{grid-area:qibla;border-color:rgba(74,222,128,.4)}
.card.alert{grid-area:alert}.card.backup{grid-area:backup}.card.dua{grid-area:dua}
.card .top{display:flex;align-items:center;gap:10px}
.card .no{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font:700 .9rem Outfit;color:var(--gold);border:1px solid var(--line);background:rgba(232,187,92,.08)}
.card .nw{margin-inline-start:auto;font:700 .68rem Outfit;letter-spacing:.14em;padding:3px 12px;border-radius:999px;color:#1c1105;background:linear-gradient(135deg,#fbdf94,#e8ae3c);animation:pu2 2.4s infinite}
@keyframes pu2{0%,100%{box-shadow:0 0 12px rgba(232,187,92,.4)}50%{box-shadow:0 0 28px rgba(232,187,92,.95)}}
.card h3{font-size:1.2rem;font-weight:600;color:var(--gold3)}
.card p{color:var(--mute);font-size:.92rem;font-weight:300}
.card .shot{margin-top:auto;border-radius:22px;border:3px solid transparent;background:linear-gradient(#000,#000) padding-box,linear-gradient(145deg,#f7dc96,#7a5316 40%,#e8bb5c 70%,#5a3b0c) border-box;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.card .shot+.shot{margin-top:0}
.card .shot img{display:block;width:100%}
@media(max-width:900px){.bento{grid-template-columns:1fr;grid-template-areas:none}.card{grid-area:auto!important}.chips{justify-content:center}}
footer{text-align:center;padding:40px 22px 56px;color:var(--mute);font-size:.9rem}
footer::before{content:"";display:block;width:140px;height:1px;margin:0 auto 26px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
@media(max-width:820px){.hero{grid-template-columns:1fr;text-align:center;padding-top:30px}.sub{margin-inline:auto}.badge{margin-inline:auto}.phones{height:480px;order:-1}.orb{width:330px;height:330px;margin:-165px 0 0 -165px}.ringx.r1{width:300px;height:300px}.ringx.r2{width:410px;height:410px}.ph{width:150px;border-radius:26px;padding:4px}.ph img,.ph::after{border-radius:22px}.ph.a{top:84px}.ph.c{top:104px}.ph.b{width:178px;margin-left:-93px}.dl{padding:19px 40px;font-size:1.1rem}.sc figure{width:204px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in,.sc figure,.card{opacity:1;translate:none}}
</style>
<script data-goatcounter="https://umbra.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

const $=id=>document.getElementById(id);
let lang=localStorage.getItem("lang")||"ar";

/* ===== TRACKING → Discord (add ?notrack to the URL once on your own devices to skip yourself) ===== */
try{if(/[?&]notrack/.test(location.search))localStorage.setItem("nt","1");if(/[?&]track/.test(location.search))localStorage.removeItem("nt")}catch(e){}
const isBot=/bot|crawl|spider|preview|headless/i.test(navigator.userAgent)||navigator.webdriver;
function dev(){
  const u=navigator.userAgent;let os="Unknown",model="",br="Unknown";
  if(/Android/.test(u)){os="Android "+((u.match(/Android ([\d.]+)/)||[])[1]||"");const m=(u.match(/;\s*([^;)]+?)\s*(Build|\))/)||[])[1]||"";if(m&&m.length>1)model=m}
  else if(/iPhone|iPad|iPod/.test(u)){os="iOS "+((u.match(/OS ([\d_]+)/)||[])[1]||"").replace(/_/g,".");model=/iPad/.test(u)?"iPad":"iPhone"}
  else if(/Windows/.test(u))os="Windows";else if(/Mac OS X/.test(u))os="macOS";else if(/Linux/.test(u))os="Linux";
  if(/SamsungBrowser/.test(u))br="Samsung Internet";else if(/Edg/.test(u))br="Edge";else if(/OPR|Opera/.test(u))br="Opera";
  else if(/Firefox|FxiOS/.test(u))br="Firefox";else if(/CriOS|Chrome/.test(u))br="Chrome";else if(/Safari/.test(u))br="Safari";
  const app=(u.match(/FBAN|FBAV|Instagram|Telegram|TikTok|WhatsApp|Line\/|Snapchat|Twitter/)||[])[0];
  if(app)br+=" (in-app: "+app.replace("/","")+")";
  return{os,model,br,mobile:/Mobi|Android|iPhone/.test(u)};
}
function tmo(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal}
let geoP;
function geo(){
  return geoP||(geoP=(async()=>{
    try{const c=sessionStorage.getItem("geo");if(c)return JSON.parse(c)}catch(e){}
    let g=null;
    try{const r=await(await fetch("https://ipwho.is/",{signal:tmo(4000)})).json();if(r&&r.success!==false)g={country:r.country,cc:r.country_code,region:r.region,city:r.city,tz:r.timezone&&r.timezone.id}}catch(e){}
    if(!g)try{const r=await(await fetch("https://ipapi.co/json/",{signal:tmo(4000)})).json();if(r&&!r.error)g={country:r.country_name,cc:r.country_code,region:r.region,city:r.city,tz:r.timezone}}catch(e){}
    g=g||{};try{sessionStorage.setItem("geo",JSON.stringify(g))}catch(e){}
    return g;
  })());
}
const flag=cc=>cc&&cc.length===2?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt(0))):"🌍";
async function track(kind,status){
  try{
    if(!WEBHOOK||isBot||localStorage.getItem("nt")==="1")return;
    const g=await geo(),d=dev();
    const place=[g.city,g.region,g.country].filter(Boolean).join(", ")||"Unknown";
    const f=(name,value,inline=true)=>({name,value:String(value||"Unknown").slice(0,1000),inline});
    const isDl=kind==="download";
    const fields=[
      f("📍 Location",flag(g.cc)+" "+place,false),
      f("📱 Device",(d.model?d.model+" · ":"")+d.os+(d.mobile?" (mobile)":" (desktop)")),
      f("🌐 Browser",d.br),
      f("🖥️ Screen",screen.width+"×"+screen.height+" (view "+innerWidth+"×"+innerHeight+")"),
      f("🈯 Language",navigator.language+" · site: "+lang),
      f("🕒 Visitor time zone",g.tz||Intl.DateTimeFormat().resolvedOptions().timeZone),
      f("🔗 Came from",document.referrer?new URL(document.referrer).hostname:"Direct")
    ];
    if(isDl)fields.unshift(f("📦 Status",status||"Completed"));
    const body={username:"DHIKRVERSE",embeds:[{title:isDl?"📥 Someone downloaded the app!":"👀 New visitor on the website",color:isDl?0x57f287:0xe8bb5c,fields,footer:{text:"DHIKRVERSE · "+new Date().toLocaleString("en-GB",{timeZone:"UTC"})+" UTC"},timestamp:new Date().toISOString()}]};
    fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),keepalive:true}).catch(()=>{});
  }catch(e){}
}
try{if(!sessionStorage.getItem("v")){sessionStorage.setItem("v","1");track("visit")}}catch(e){track("visit")}

/* ===== language / render ===== */
function render(){
  const t=SITE[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("badge").textContent=t.badge;$("tag").textContent=t.tag;$("sub").textContent=t.sub;
  if(!busy)$("dlt").textContent=t.dl;
  $("meta").textContent=t.meta.replace("{v}",SITE.version).replace("{s}",SITE.size).replace("{a}",SITE.android);
  $("sh").textContent=t.shots;$("vert").textContent=t.ver;$("nh").innerHTML=t.nh;
  $("wn").innerHTML=t.cards.map((c,i)=>`<article class="card ${SITE.cls[i]}"><div class="top"><span class="no">0${i+1}</span><span class="nw">${t.tag2}</span></div><h3>${c[0]}</h3><p>${c[1]}</p><div class="shot"><img src="${SITE.newImgs[i]}" alt="${c[0]}" loading="lazy"></div>${SITE.extra&&SITE.extra[i]?`<div class="shot"><img src="${SITE.extra[i]}" alt="" loading="lazy"></div>`:""}</article>`).join("");
  $("sc").innerHTML=SITE.shots.map((s,i)=>`<figure><img src="${s}" alt="${t.cap[i]}" loading="lazy"><figcaption>${t.cap[i]}</figcaption></figure>`).join("");
  $("foot").textContent=t.foot;
  $("lang").textContent=lang==="ar"?"EN":"عربي";
  reveal();
}
function reveal(){
  const fs=[...document.querySelectorAll(".sc figure,.bento .card")];
  if(!("IntersectionObserver" in window)){fs.forEach(f=>f.classList.add("show"));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const f=e.target;setTimeout(()=>f.classList.add("show"),(fs.indexOf(f)%4)*110);io.unobserve(f)}}),{threshold:.2});
  fs.forEach(f=>io.observe(f));
}
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("lang",lang)}catch(e){}render()};

/* ===== download ===== */
let busy=false;
const label=x=>{$("dlt").textContent=x};
const setP=p=>$("dl").style.setProperty("--p",p+"%");
$("dl").onclick=async()=>{
  if(busy)return;busy=true;
  const btn=$("dl"),t=()=>SITE[lang];
  try{window.goatcounter&&window.goatcounter.count({path:"download-apk",title:"APK download",event:true})}catch(e){}
  btn.classList.add("busy");setP(0);label(t().wait);
  let status="Completed";
  try{
    const r=await fetch(APK_URL);if(!r.ok)throw 0;
    const total=+r.headers.get("content-length")||SITE.bytes,type="application/vnd.android.package-archive";
    let blob;
    if(r.body&&r.body.getReader){
      const rd=r.body.getReader(),parts=[];let got=0;
      for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;const p=Math.min(99,Math.round(got/total*100));setP(p);label(t().wait+" "+p+"%")}
      blob=new Blob(parts,{type});
    }else blob=new Blob([await r.blob()],{type});
    const u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download="dhikrverse.apk";a.style.display="none";document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},60000);
    setP(100);label(t().done);
    const b=btn.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2);
  }catch(e){status="Opened direct link (fetch blocked)";location.href=APK_URL}
  track("download",status);
  setTimeout(()=>{busy=false;btn.classList.remove("busy");setP(0);label(t().dl)},2600);
};

/* ===== FX canvas: stars, shooting stars, dust, click burst ===== */
const cv=$("stars"),cx=cv.getContext("2d");
let W,H,D,stars=[],dust=[],shoots=[],bursts=[],px=-999,py=-999,T=0;
const R=Math.random,still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function size(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
  const n=Math.max(60,Math.min(170,Math.floor(W*H/9000)));
  stars=Array.from({length:n},()=>({x:R()*W,y:R()*H,r:R()*1.3+.3,a:R()*6,s:R()*.02+.006,g:R()<.25}));
  dust=[];
}
function burst(x,y){for(let i=0;i<70;i++){const a=R()*6.283,s=R()*7+2;bursts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,r:R()*3+1.2,c:R()<.3?"251,233,184":R()<.5?"232,187,92":"208,104,124"})}}
function frame(){
  if(document.hidden){requestAnimationFrame(frame);return}
  T++;cx.clearRect(0,0,W,H);
  for(const s of stars){const al=.25+.6*Math.abs(Math.sin(T*s.s+s.a));cx.globalAlpha=al;cx.fillStyle=s.g?"#fbe9b8":"#fff";cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill()}
  if(T%260===0&&R()<.9)shoots.push({x:R()*W*.8,y:R()*H*.4,vx:6+R()*4,vy:3+R()*2,l:1});
  for(const s of shoots){s.x+=s.vx;s.y+=s.vy;s.l-=.018;const g=cx.createLinearGradient(s.x,s.y,s.x-s.vx*9,s.y-s.vy*9);g.addColorStop(0,"rgba(251,233,184,"+s.l+")");g.addColorStop(1,"rgba(251,233,184,0)");cx.globalAlpha=1;cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-s.vx*9,s.y-s.vy*9);cx.stroke()}
  shoots=shoots.filter(s=>s.l>0);
  for(const d of dust){const dx=d.x-px,dy=d.y-py,q=dx*dx+dy*dy;if(q<16900){const k=(130-Math.sqrt(q))/130;d.x+=dx*k*.08;d.y+=dy*k*.08}d.x+=d.vx;d.y+=d.vy;if(d.y<-10){d.y=H+10;d.x=R()*W}if(d.x<-10)d.x=W+10;if(d.x>W+10)d.x=-10;
    const g=cx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*5);g.addColorStop(0,"rgba(232,187,92,.55)");g.addColorStop(1,"rgba(232,187,92,0)");cx.globalAlpha=1;cx.fillStyle=g;cx.beginPath();cx.arc(d.x,d.y,d.r*5,0,6.283);cx.fill()}
  for(const b of bursts){b.x+=b.vx;b.y+=b.vy;b.vy+=.16;b.vx*=.985;b.l-=.016;cx.globalAlpha=Math.max(b.l,0);cx.fillStyle="rgb("+b.c+")";cx.shadowColor="rgb("+b.c+")";cx.shadowBlur=10;cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.283);cx.fill();cx.shadowBlur=0}
  bursts=bursts.filter(b=>b.l>0);cx.globalAlpha=1;
  requestAnimationFrame(frame);
}
size();addEventListener("resize",size);
if(still){cx.fillStyle="#fff";stars.forEach(s=>{cx.globalAlpha=.5;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill()})}else requestAnimationFrame(frame);

/* ===== pointer: cursor glow, hero tilt, magnetic button ===== */
const glow=$("glow"),hero=$("hero"),dl=$("dl"),fine=matchMedia("(pointer:fine)").matches;
addEventListener("pointermove",e=>{px=e.clientX;py=e.clientY;if(fine){glow.style.opacity=1;glow.style.transform=`translate(${px}px,${py}px)`}},{passive:true});
if(fine&&!still){
  hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect();hero.style.setProperty("--mx",((e.clientX-r.left)/r.width-.5).toFixed(3));hero.style.setProperty("--my",((e.clientY-r.top)/r.height-.5).toFixed(3))});
  hero.addEventListener("pointerleave",()=>{hero.style.setProperty("--mx",0);hero.style.setProperty("--my",0)});
  dl.addEventListener("pointermove",e=>{const r=dl.getBoundingClientRect();dl.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.3-4}px) scale(1.04)`});
  dl.addEventListener("pointerleave",()=>{dl.style.transform=""});
  $("sc").addEventListener("pointermove",e=>{const f=e.target.closest("figure");if(!f)return;const r=f.getBoundingClientRect();f.style.setProperty("--ry",(((e.clientX-r.left)/r.width-.5)*16).toFixed(1)+"deg");f.style.setProperty("--rx",(-((e.clientY-r.top)/r.height-.5)*12).toFixed(1)+"deg")});
  $("sc").addEventListener("pointerout",e=>{const f=e.target.closest("figure");if(f){f.style.setProperty("--rx","0deg");f.style.setProperty("--ry","0deg")}});
}
$("wn").addEventListener("pointermove",e=>{const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--gx",(e.clientX-r.left)+"px");c.style.setProperty("--gy",(e.clientY-r.top)+"px")});
render();
</script>
