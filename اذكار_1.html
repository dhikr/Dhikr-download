  const asin = x => Math.asin(x)/R, acos = x => Math.acos(x)/R, atan2 = (y,x) => Math.atan2(y,x)/R, acot = x => Math.atan(1/x)/R;
  const fixA = a => { a %= 360; return a < 0 ? a+360 : a; }, fixH = h => { h %= 24; return h < 0 ? h+24 : h; };
  const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
  let yy = y, mm = m; if(mm <= 2){ yy--; mm += 12; }
  const A = Math.floor(yy/100), B = 2 - A + Math.floor(A/4);
  const jd = Math.floor(365.25*(yy+4716)) + Math.floor(30.6001*(mm+1)) + d + B - 1524.5 - lon/360;
  const tz = -new Date(y, m-1, d, 12).getTimezoneOffset()/60;
  const sunPos = t => {
    const D = jd + t - 2451545.0, g = fixA(357.529 + 0.98560028*D), q = fixA(280.459 + 0.98564736*D);
    const L = fixA(q + 1.915*sin(g) + 0.020*sin(2*g)), e = 23.439 - 0.00000036*D;
    const RA = atan2(cos(e)*sin(L), cos(L))/15;
    return {decl: asin(sin(e)*sin(L)), eqt: q/15 - fixH(RA)};
  };
  const noon = t => fixH(12 - sunPos(t).eqt);
  const angleT = (ang, t, ccw) => {
    const dc = sunPos(t).decl, v = (-sin(ang) - sin(dc)*sin(lat)) / (cos(dc)*cos(lat)), h = acos(v)/15;
    return noon(t) + (ccw ? -h : h);
  };
  const asrT = (f, t) => { const dc = sunPos(t).decl; return angleT(-acot(f + tan(Math.abs(lat - dc))), t); };
  const M = PM[method] || PM.mwl, r = {};
  r.fajr = angleT(M.f, 5/24, true);
  r.sunrise = angleT(0.833, 6/24, true);
  r.dhuhr = noon(12/24);
  r.asr = asrT(asrF === 2 ? 2 : 1, 13/24);
  r.maghrib = angleT(0.833, 18/24);
  r.isha = M.im ? r.maghrib + M.im/60 : angleT(M.i, 18/24);
  for(const k in r) r[k] = r[k] + tz - lon/15;
  return r;
}
/* Sun altitude/azimuth (degrees, azimuth clockwise from north) at an instant for a place. */
function sunAt(ms, lat, lon){
  const R = Math.PI/180, D = ms/86400000 + 2440587.5 - 2451545.0, fix = a => { a %= 360; return a < 0 ? a+360 : a; };
  const g = fix(357.529 + 0.98560028*D), q = fix(280.459 + 0.98564736*D);
  const L = fix(q + 1.915*Math.sin(g*R) + 0.020*Math.sin(2*g*R)), e = 23.439 - 0.00000036*D;
  const RA = fix(Math.atan2(Math.cos(e*R)*Math.sin(L*R), Math.cos(L*R))/R);
  const dc = Math.asin(Math.sin(e*R)*Math.sin(L*R));
  const H = fix(280.46061837 + 360.98564736629*D + lon - RA)*R, la = lat*R;
  const alt = Math.asin(Math.sin(la)*Math.sin(dc) + Math.cos(la)*Math.cos(dc)*Math.cos(H))/R;
  const az = fix(Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(la) - Math.tan(dc)*Math.cos(la))/R + 180);
  return {alt, az};
}
function qiblaBearing(lat, lon){
  const R = Math.PI/180, k1 = 21.4225*R, dl = (39.8262 - lon)*R, p = lat*R;
  return (Math.atan2(Math.sin(dl)*Math.cos(k1), Math.cos(p)*Math.sin(k1) - Math.sin(p)*Math.cos(k1)*Math.cos(dl))/R + 360) % 360;
}
/* @@PT-END */

/* ---------- native bridge (only active inside the Capacitor Android app) ---------- */
const CAP = window.Capacitor;
const isNative = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const NativeGeo = isNative ? CAP.registerPlugin('Geolocation') : null;
const NativePrefs = isNative ? CAP.registerPlugin('Preferences') : null;
function pushWidget(){
  if(!NativePrefs || !S.pt) return;
  try{
    const items = [];
    for(let add = 0; add < 3; add++){
      const o = ptDay(add);
      ['fajr','dhuhr','asr','maghrib','isha'].forEach(k => { if(!isNaN(o[k])) items.push({k, n:T[S.lang]['pn_' + k], ts:o[k]}); });
    }
    items.sort((a,b) => a.ts - b.ts);
    NativePrefs.set({key:'widget_data', value:JSON.stringify({city:cityLabel(), label:T[S.lang].p_next, items})}).catch(() => {});
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if(document.hidden) pushWidget(); });

const ptCache = {};
function ptDay(add){
  const p = S.pt, n = new Date(), d = new Date(n.getFullYear(), n.getMonth(), n.getDate() + add);
  const key = [d.getTime(), p.lat, p.lon, p.method, p.asr, JSON.stringify(p.adj || {})].join('|');
  if(!ptCache[key]){
    const r = computePrayer(d, p.lat, p.lon, p.method, p.asr), o = {};
    PN.forEach(k => { o[k] = isNaN(r[k]) ? NaN : d.getTime() + (Math.round(r[k]*60) + ((p.adj || {})[k] || 0))*60000; });
    ptCache[key] = o;
  }
  return ptCache[key];
}
function nextPrayer(){
  if(!S.pt) return null;
  const now = Date.now();
  for(let add = 0; add < 2; add++){
    const o = ptDay(add);
    for(const k of ['fajr','dhuhr','asr','maghrib','isha']) if(o[k] > now) return {k, ts:o[k], tomorrow:add === 1};
  }
  return null;
}
const fmtTime = ms => isNaN(ms) ? '—' : new Date(ms).toLocaleTimeString(S.lang === 'ar' ? 'ar-EG-u-nu-latn' : 'en-US', {hour:'numeric', minute:'2-digit', hour12:true});
function fmtCd(ms){
  const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h + ':' + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0');
}
const compass = deg => t('dirs')[Math.round(deg/45) % 8];
function cityLabel(){
  const p = S.pt; if(!p) return '';
  if(typeof p.city === 'number' && CITIES[p.city]) return CITIES[p.city][S.lang === 'ar' ? 0 : 1];
  return '📍 ' + p.lat.toFixed(2) + '°, ' + p.lon.toFixed(2) + '°';
}
function nearestCity(lat, lon){
  let best = 0, bd = 1e9;
  CITIES.forEach((c,i) => { const d = (c[2]-lat)**2 + ((c[3]-lon)*Math.cos(lat*Math.PI/180))**2; if(d < bd){ bd = d; best = i; } });
  return CITIES[best];
}
function tickPrayer(){
  const nx = nextPrayer();
  const lab = $('pc-label'); lab.textContent = t('p_next');
  if(!S.pt || !nx){
    $('pc-name').textContent = t('p_set'); $('pc-time').textContent = ''; $('pc-cd').textContent = ''; lab.textContent = '';
    return;
  }
  const name = t('pn_' + nx.k) + (nx.tomorrow ? ' · ' + t('p_tmrw') : '');
  $('pc-name').textContent = name; $('pc-time').textContent = fmtTime(nx.ts); $('pc-cd').textContent = fmtCd(nx.ts - Date.now());
  $('pv-nn').textContent = name; $('pv-nt').textContent = fmtTime(nx.ts); $('pv-cd').textContent = fmtCd(nx.ts - Date.now());
}
function renderSun(){
  const p = S.pt; if(!p) return;
  const now = Date.now(), o = ptDay(0), cx = 180, cy = 120, rx = 150, ry = 96;
  const rise = o.sunrise, set = o.maghrib;
  let f, up = !isNaN(rise) && !isNaN(set) && now >= rise && now <= set;
  if(up) f = (now - rise)/(set - rise);
  else {
    const a = now < rise ? ptDay(-1).maghrib : set, b = now < rise ? rise : ptDay(1).sunrise;
    f = isNaN(a) || isNaN(b) ? .5 : Math.min(1, Math.max(0, (now - a)/(b - a)));
  }
  const bx = (cx - rx*Math.cos(Math.PI*f)).toFixed(1), by = (up ? cy - ry*Math.sin(Math.PI*f) : cy + 30*Math.sin(Math.PI*f)).toFixed(1);
  const body = up
    ? `<circle cx="${bx}" cy="${by}" r="26" fill="url(#sunGlow)"/><circle cx="${bx}" cy="${by}" r="10" fill="#fff3b0" stroke="var(--gold-accent)" stroke-width="2"/>`
    : `<circle cx="${bx}" cy="${by}" r="9" fill="#e8edf7"/><circle cx="${(+bx) + 3.5}" cy="${(+by) - 2.5}" r="7.5" fill="var(--bg-secondary)"/>`;
  $('sun-svg').innerHTML =
    `<defs><radialGradient id="sunGlow"><stop offset="0" stop-color="#ffe27a" stop-opacity=".85"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>` +
    `<linearGradient id="dayFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--gold-accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--gold-accent);stop-opacity:.02"/></linearGradient></defs>` +
    `<path d="M${cx-rx},${cy} A${rx},${ry} 0 0 1 ${cx+rx},${cy}Z" fill="url(#dayFill)"/>` +
    `<path d="M${cx-rx},${cy} A${rx},${ry} 0 0 1 ${cx+rx},${cy}" fill="none" stroke="var(--gold-accent)" stroke-width="2" stroke-dasharray="${up ? '0' : '3 6'}" stroke-linecap="round" opacity="${up ? 1 : .5}"/>` +
    `<path d="M${cx-rx},${cy} A${rx},30 0 0 0 ${cx+rx},${cy}" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 6" opacity=".5"/>` +
    `<line x1="8" y1="${cy}" x2="352" y2="${cy}" stroke="var(--text-muted)" stroke-width="1" opacity=".6"/>` +
    body +
    `<text x="${cx-rx}" y="${cy+24}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${esc(t('pn_sunrise'))}</text><text x="${cx-rx}" y="${cy+39}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--gold-primary)">${esc(fmtTime(rise))}</text>` +
    `<text x="${cx+rx}" y="${cy+24}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${esc(t('p_sunset'))}</text><text x="${cx+rx}" y="${cy+39}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--gold-primary)">${esc(fmtTime(set))}</text>`;
  const q = qiblaBearing(p.lat, p.lon);
  $('sun-read').innerHTML = `<div class="sr-box" style="grid-column:1/-1"><span class="sr-l">${t('p_qibla')} · ${compass(q)}</span> <span class="sr-v">${Math.round(q)}°</span></div>`;
}
function renderPrayerView(){
  const has = !!S.pt;
  $('pv-empty').style.display = has ? 'none' : 'flex'; $('pv-body').style.display = has ? 'contents' : 'none';
  if(!has) return;
  $('pv-city').textContent = cityLabel();
  $('pv-src').textContent = t({tz:'p_src_tz', gps:'p_src_gps', city:'p_src_city', man:'p_src_man'}[S.pt.src] || 'p_src_city');
  const o = ptDay(0), nx = nextPrayer(), now = Date.now();
  $('p-table').innerHTML = PN.map(k => {
    const cls = 'p-row' + (k === 'sunrise' ? ' sun' : '') + (nx && !nx.tomorrow && nx.k === k ? ' next' : (o[k] < now ? ' past' : ''));
    return `<div class="${cls}"><span>${t('pn_' + k)}</span><span>${fmtTime(o[k])}</span></div>`;
  }).join('');
  renderSun();
}
function renderPrayerAll(){ tickPrayer(); renderPrayerView(); renderTracker(); pushWidget(); }

/* location & method dialog */
function fillPrayerDialog(){
  const p = S.pt || {city:'custom', lat:'', lon:'', method:'mwl', asr:1};
  $('p-city').innerHTML = `<option value="custom">${t('p_custom')}</option>` + CITIES.map((c,i) => `<option value="${i}">${c[S.lang === 'ar' ? 0 : 1]}</option>`).join('');
  $('p-city').value = typeof p.city === 'number' ? String(p.city) : 'custom';
  $('p-method').innerHTML = Object.keys(PM).map(k => `<option value="${k}">${PM[k][S.lang]}</option>`).join('');
  $('p-method').value = p.method;
  $('p-asr').options[0].textContent = t('p_shafi'); $('p-asr').options[1].textContent = t('p_hanafi'); $('p-asr').value = String(p.asr || 1);
  $('p-lat').value = p.lat; $('p-lon').value = p.lon;
  $('p-adj').innerHTML = PN.map(k => `<label>${t('pn_' + k)}<input type="number" step="1" min="-30" max="30" inputmode="numeric" data-k="${k}" value="${(p.adj || {})[k] || 0}"></label>`).join('');
}
function savePt(){ persist(); renderPrayerAll(); }
function ensurePt(){ if(!S.pt) S.pt = {city:'custom', lat:0, lon:0, method:'mwl', asr:1, src:'man'}; return S.pt; }
$('p-city').onchange = e => {
  if(e.target.value === 'custom') return;
  const i = +e.target.value, c = CITIES[i], p = ensurePt();
  p.city = i; p.lat = c[2]; p.lon = c[3]; p.src = 'city'; if(!p.mset) p.method = c[4];
  fillPrayerDialog(); savePt();
};
$('p-method').onchange = e => { const p = ensurePt(); p.method = e.target.value; p.mset = true; savePt(); };
$('p-asr').onchange = e => { ensurePt().asr = +e.target.value; savePt(); };
function manualCoords(){
  const la = parseFloat($('p-lat').value), lo = parseFloat($('p-lon').value);
  if(!isFinite(la) || !isFinite(lo) || Math.abs(la) > 90 || Math.abs(lo) > 180) return;
  const p = ensurePt(); p.lat = la; p.lon = lo; p.city = 'custom'; p.src = 'man';
  if(!p.mset) p.method = nearestCity(la, lo)[4];
  savePt(); $('p-city').value = 'custom'; $('p-method').value = p.method;
}
$('p-lat').onchange = $('p-lon').onchange = manualCoords;
$('p-adj').addEventListener('change', e => {
  const k = e.target.dataset.k; if(!k) return;
  const p = ensurePt(); p.adj = p.adj || {}; p.adj[k] = Math.max(-30, Math.min(30, parseInt(e.target.value) || 0)); e.target.value = p.adj[k]; savePt();
});
function applyPos(lat, lon, auto){
  const p = ensurePt(), la = +(+lat).toFixed(4), lo = +(+lon).toFixed(4);
  p.lat = la; p.lon = lo; p.city = 'gps'; p.src = 'gps'; if(!p.mset) p.method = nearestCity(la, lo)[4];
  savePt(); fillPrayerDialog(); if(!auto) toast(t('p_locok'));
}
async function useGPS(auto){
  if(NativeGeo){
    try{
      let perm = await NativeGeo.checkPermissions();
      if(perm.location !== 'granted' && perm.coarseLocation !== 'granted') perm = await NativeGeo.requestPermissions();
      if(perm.location !== 'granted' && perm.coarseLocation !== 'granted'){ if(!auto) toast(t('p_locfail')); return; }
      const pos = await NativeGeo.getCurrentPosition({enableHighAccuracy:false, timeout:15000});
      applyPos(pos.coords.latitude, pos.coords.longitude, auto);
    }catch(e){ if(!auto) toast(t('p_locfail')); }
    return;
  }
  if(!navigator.geolocation){ if(!auto) toast(t('p_locfail')); return; }
  navigator.geolocation.getCurrentPosition(pos => applyPos(pos.coords.latitude, pos.coords.longitude, auto),
    () => { if(!auto) toast(t('p_locfail')); }, {timeout:9000, maximumAge:600000});
}
$('p-gps').onclick = () => useGPS(false);
$('p-close').onclick = () => hide('prayer-modal');
$('prayer-modal').addEventListener('click', e => { if(e.target.id === 'prayer-modal') hide('prayer-modal'); });
const openPrayerDialog = () => { fillPrayerDialog(); show('prayer-modal'); };
$('pv-edit').onclick = $('pv-set').onclick = openPrayerDialog;
$('prayer-card').onclick = () => goTo('view-prayer');
$('prayer-card').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goTo('view-prayer'); } });
(function initPrayer(){
  if(!S.pt){
    let tzn = ''; try{ tzn = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
    const i = CITIES.findIndex(c => c[5] === tzn);
    if(i >= 0){ const c = CITIES[i]; S.pt = {city:i, lat:c[2], lon:c[3], method:c[4], asr:1, src:'tz'}; persist(); }
  }
  setInterval(tickPrayer, 1000);
  setInterval(() => { if($('view-prayer').classList.contains('active')) { renderPrayerView(); renderTracker(); } pushWidget(); }, 60000);
  if(isNative && !S.gpsTried) setTimeout(() => { S.gpsTried = true; persist(); useGPS(true); }, 4400);
})();

/* ---------- splash (exactly 4 seconds) ---------- */
(function splash(){
  const fill = $('loader-fill'), el = $('splash-screen'), t0 = performance.now(), D = 4000;
  (function step(now){
    const p = Math.min((now - t0)/D*100, 100); fill.style.width = p + '%';
    if(p < 100) requestAnimationFrame(step); else { el.classList.add('fade-out'); setTimeout(() => el.remove(), 800); }
  })(t0);
})();

/* ---------- init ---------- */
if(!findItem(S.activeId)) S.activeId = 1;
active = findItem(S.activeId);
if(S.target === undefined || S.target === null) S.target = active.target;
applyTheme(); applyI18n(); buildPresets(); resize();
renderChips(); renderLibrary(); renderHome(false); renderDuas(); syncSettings(); renderPrayerAll();
checkAch(true); checkLevel(true);
if(S.awake) setAwake(true);
drawBeads(beadPos); startLoop();
</script>
