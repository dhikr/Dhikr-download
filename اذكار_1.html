/* ================= THEMES ================= */
:root.theme-golden-dark{--bg-primary:#0a0b0e;--bg-secondary:#12141a;--bg-card:rgba(18,20,26,.72);--border-color:rgba(212,175,55,.25);--gold-primary:#f3e5ab;--gold-accent:#d4af37;--gold-gradient:linear-gradient(135deg,#bf953f,#fcf6ba,#b38728,#fbf5b7,#aa771c);--text-main:#f3f4f6;--text-muted:#9ca3af;--glow-color:rgba(212,175,55,.35)}
:root.theme-dark-golden{--bg-primary:#120e0a;--bg-secondary:#1a1410;--bg-card:rgba(26,20,16,.74);--border-color:rgba(225,150,60,.3);--gold-primary:#ffd27f;--gold-accent:#e59400;--gold-gradient:linear-gradient(135deg,#c67d0a,#ffe599,#d98200,#fff0b3,#b06500);--text-main:#fffaf0;--text-muted:#b8a28e;--glow-color:rgba(229,148,0,.4)}
:root.theme-pink-gold{--bg-primary:#120a10;--bg-secondary:#1a1218;--bg-card:rgba(26,18,24,.74);--border-color:rgba(255,150,200,.3);--gold-primary:#ffb7eb;--gold-accent:#ff69b4;--gold-gradient:linear-gradient(135deg,#d44d97,#ffc2e2,#ff69b4,#ffe3f1,#ab2e73);--text-main:#fff5fa;--text-muted:#d19fb9;--glow-color:rgba(255,105,180,.4)}
:root.theme-solar-gold{--bg-primary:#070d14;--bg-secondary:#0e1726;--bg-card:rgba(14,23,38,.74);--border-color:rgba(0,210,255,.3);--gold-primary:#80e5ff;--gold-accent:#00bfff;--gold-gradient:linear-gradient(135deg,#0088cc,#a6f0ff,#00bfff,#d6f7ff,#006699);--text-main:#f0fbff;--text-muted:#8ab4d1;--glow-color:rgba(0,191,255,.4)}
:root.theme-emerald-gold{--bg-primary:#06120c;--bg-secondary:#0d1f16;--bg-card:rgba(13,31,22,.74);--border-color:rgba(46,204,113,.3);--gold-primary:#a3e4d7;--gold-accent:#2ecc71;--gold-gradient:linear-gradient(135deg,#27ae60,#d4efdf,#2ecc71,#e8f8f5,#1e8449);--text-main:#f2f9f5;--text-muted:#98bcab;--glow-color:rgba(46,204,113,.4)}
:root.hc{--border-color:rgba(255,255,255,.75);--text-muted:#e5e7eb;--bg-card:rgba(0,0,0,.92)}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{font-family:'Outfit','Cairo','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg-primary);color:var(--text-main);min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:background .6s}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-accent);outline-offset:2px}

/* ================= COSMOS BACKGROUND ================= */
#cosmos,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#cosmos{z-index:0}
#fx{z-index:900}
.nebula{position:fixed;inset:-10%;z-index:0;pointer-events:none;opacity:.55;
 background:radial-gradient(45% 35% at 18% 12%,var(--glow-color),transparent 70%),
            radial-gradient(40% 35% at 88% 72%,rgba(120,80,255,.16),transparent 70%),
            radial-gradient(50% 40% at 40% 100%,var(--glow-color),transparent 72%);
 animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.12)}}

/* ================= SPLASH ================= */
#splash-screen{position:fixed;inset:0;background:var(--bg-primary);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:opacity .7s ease,visibility .7s ease}
#splash-screen.fade-out{opacity:0;visibility:hidden}
.splash-star{width:150px;height:150px;margin-bottom:6px;filter:drop-shadow(0 0 14px var(--glow-color))}
.splash-star .s1{transform-origin:center;animation:spin 14s linear infinite}
.splash-star .s2{transform-origin:center;animation:spin 22s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-logo{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic','Scheherazade New',serif;font-size:3.6rem;font-weight:700;background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2;animation:rise 1.2s var(--ease,ease) both}
.splash-sub{color:var(--text-muted);font-size:.9rem;letter-spacing:6px;margin-bottom:6px;animation:rise 1.2s .2s both}
.splash-ayah{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic','Scheherazade New',serif;color:var(--gold-primary);font-size:1.15rem;opacity:.85;margin-bottom:18px;animation:rise 1.4s .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.loader-bar-container{width:190px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;position:relative}
.loader-bar-fill{position:absolute;top:0;inset-inline-start:0;bottom:0;width:0;background:var(--gold-gradient);box-shadow:0 0 12px var(--gold-accent)}

/* ================= SHELL ================= */
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:560px;width:100%;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:linear-gradient(var(--bg-secondary),transparent);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.app-title{font-size:1.1rem;font-weight:700;background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px}
.top-controls{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:20px;border:1px solid var(--border-color);background:var(--bg-card);font-size:.82rem;font-weight:600;color:var(--gold-primary)}
.chip.dim{opacity:.55}
.icon-btn{background:var(--bg-card);border:1px solid var(--border-color);color:var(--gold-primary);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s;font-size:.95rem}
.icon-btn:hover{transform:scale(1.08);box-shadow:0 0 12px var(--glow-color)}
.glass{background:var(--bg-card);border:1px solid var(--border-color);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.view{display:none;flex:1;padding:16px;flex-direction:column;gap:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.view.active{display:flex;animation:viewIn .45s var(--ease,ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.section-title{font-size:1.05rem;font-weight:700;color:var(--gold-primary);display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ================= HOME ================= */
.home-grid{display:flex;flex-direction:column;gap:16px}
.g-a{display:flex;flex-direction:column;gap:12px;grid-area:a}
.g-c{display:flex;flex-direction:column;gap:12px;align-items:center;grid-area:c}
.goal-wrap{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.goal-row{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-muted)}
.goal-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.goal-fill{height:100%;width:0;background:var(--gold-gradient);border-radius:3px;box-shadow:0 0 10px var(--gold-accent);transition:width .4s}
.goal-wrap.hit .goal-row b{color:var(--gold-accent)}
.dhikr-card{padding:16px 18px 20px;text-align:center;position:relative;overflow:hidden}
.dhikr-card::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,var(--glow-color),transparent 30%);opacity:.25;animation:spin 16s linear infinite;pointer-events:none}
.dhikr-card>*{position:relative}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card-top .icon-btn{width:34px;height:34px;font-size:1.05rem}
.fav-on{color:#ffd54a!important;border-color:#ffd54a!important}
.arabic-text{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic','Scheherazade New',serif;font-size:2.15rem;font-weight:700;line-height:1.6;background:var(--gold-gradient);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;filter:drop-shadow(0 2px 8px var(--glow-color));animation:shimmer 6s linear infinite}
.arabic-text.long{font-size:1.6rem}
@keyframes shimmer{from{background-position:0 0}to{background-position:-220% 0}}
.dhikr-card.swap .arabic-text,.dhikr-card.swap .translit-text,.dhikr-card.swap .meaning-text{animation:swapIn .45s var(--ease,ease)}
@keyframes swapIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.translit-text{font-size:.98rem;color:var(--gold-primary);margin-bottom:6px;font-weight:500}
.meaning-text{font-size:.88rem;color:var(--text-muted);line-height:1.6}
.source-tag{display:inline-block;margin-top:10px;font-size:.72rem;color:var(--text-muted);border:1px solid var(--border-color);border-radius:12px;padding:3px 10px}
.source-tag:empty{display:none}

/* beads */
#beads{width:100%;max-width:500px;height:auto;overflow:visible}
#bead-string{fill:none;stroke:var(--gold-accent);stroke-width:1.4;opacity:.55}

/* counter */
.counter-ring-wrapper{position:relative;width:min(250px,72vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;border-radius:50%;outline-offset:6px}
.counter-ring-wrapper::before{content:'';position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,var(--glow-color),transparent 68%);opacity:.5;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.1);opacity:.85}}
.counter-ring-wrapper.pulse{animation:press .22s var(--ease,ease)}
@keyframes press{40%{transform:scale(.93)}}
.counter-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.counter-track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:7}
.counter-progress{fill:none;stroke:var(--gold-accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .28s ease;filter:drop-shadow(0 0 10px var(--gold-accent))}
.ring-tip{fill:#fff;filter:drop-shadow(0 0 8px var(--gold-accent)) drop-shadow(0 0 16px var(--gold-accent))}
.counter-inner{display:flex;flex-direction:column;align-items:center;z-index:2;pointer-events:none}
.count-display{font-size:3.7rem;font-weight:700;background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;font-variant-numeric:tabular-nums}
.count-display.bump{animation:bump .25s var(--ease,ease)}
@keyframes bump{40%{transform:scale(1.14)}}
.target-display{font-size:.95rem;color:var(--text-muted);margin-top:4px}
.tap-hint{font-size:.75rem;color:var(--text-muted);opacity:.8}
.ripple{position:absolute;border-radius:50%;pointer-events:none;border:2px solid var(--gold-accent);width:20px;height:20px;margin:-10px 0 0 -10px;animation:ripple .65s ease-out forwards;z-index:3}
@keyframes ripple{to{transform:scale(11);opacity:0}}
.floating-plus{position:absolute;color:var(--gold-primary);font-weight:700;font-size:1.4rem;pointer-events:none;animation:floatUp .75s ease-out forwards;z-index:50;text-shadow:0 0 10px var(--gold-accent)}
@keyframes floatUp{0%{transform:translateY(0) scale(.8);opacity:1}100%{transform:translateY(-80px) scale(1.3);opacity:0}}
.action-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.action-btn{background:var(--bg-card);border:1px solid var(--border-color);color:var(--gold-primary);padding:9px 18px;border-radius:25px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:6px;transition:.2s;backdrop-filter:blur(10px)}
.action-btn:hover{background:var(--border-color);transform:translateY(-2px);box-shadow:0 0 14px var(--glow-color)}


/* ================= LIBRARY ================= */
.search{width:100%;background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:11px 14px;font-size:.95rem;outline:none;backdrop-filter:blur(10px)}
.search:focus{border-color:var(--gold-accent);box-shadow:0 0 12px var(--glow-color)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-muted);padding:6px 14px;border-radius:18px;font-size:.8rem;font-weight:600;transition:.2s}
.chip-btn.on{background:var(--gold-gradient);color:#000;border-color:transparent}
.library-grid{display:flex;flex-direction:column;gap:10px}
.lib-card{display:flex;gap:10px;align-items:center;padding:13px 14px;border-radius:16px;cursor:pointer;transition:.2s}
.lib-card:hover{border-color:var(--gold-accent);transform:translateY(-2px);box-shadow:0 6px 20px var(--glow-color)}
.lib-card.current{border-color:var(--gold-accent);box-shadow:0 0 16px var(--glow-color)}
.lib-main{flex:1;min-width:0}
.lib-arabic{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic','Scheherazade New',serif;font-size:1.3rem;color:var(--gold-primary);line-height:1.6}
.lib-info{font-size:.78rem;color:var(--text-muted);margin-top:2px}
.lib-actions{display:flex;flex-direction:column;gap:6px;align-items:center}
.mini-btn{background:none;border:1px solid var(--border-color);border-radius:50%;width:32px;height:32px;color:var(--gold-primary);font-size:.95rem}
.mini-btn.fav-on{background:rgba(255,213,74,.12)}
.empty{text-align:center;color:var(--text-muted);font-size:.85rem;padding:22px}

/* ================= MORNING / EVENING ================= */
.seg{display:flex;padding:4px;border-radius:16px;gap:4px}
.seg button{flex:1;border:none;background:none;color:var(--text-muted);padding:10px;border-radius:12px;font-weight:700;font-size:.95rem;transition:.25s}
.seg button.on{background:var(--gold-gradient);color:#000;box-shadow:0 0 16px var(--glow-color)}
.me-head{padding:14px 16px;display:flex;align-items:center;gap:14px}
.me-pct{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;background:conic-gradient(var(--gold-accent) var(--p,0%),rgba(255,255,255,.08) 0);position:relative}
.me-pct::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--bg-secondary)}
.me-pct span{position:relative}
.me-list{display:flex;flex-direction:column;gap:10px}
.me-card{padding:14px 16px;border-radius:18px;cursor:pointer;position:relative;overflow:hidden;transition:.2s;user-select:none;-webkit-user-select:none}
.me-card:active{transform:scale(.985)}
.me-card .fillbar{position:absolute;inset-block:0;inset-inline-start:0;width:var(--f,0%);background:linear-gradient(90deg,var(--glow-color),transparent);opacity:.55;transition:width .3s}
.me-card>*{position:relative}
.me-card.done{border-color:var(--gold-accent)}
.me-ar{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic','Scheherazade New',serif;font-size:1.35rem;line-height:1.9;color:var(--gold-primary)}
.me-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.me-src{font-size:.72rem;color:var(--text-muted)}
.me-count{font-weight:700;color:var(--gold-accent);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.me-en{font-size:.8rem;color:var(--text-muted);margin-top:2px}

/* ================= STATS ================= */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-box{padding:16px;text-align:center}
.stat-value{font-size:1.9rem;font-weight:700;background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;font-variant-numeric:tabular-nums}
.stat-label{font-size:.8rem;color:var(--text-muted)}
.level-card{padding:16px;display:flex;flex-direction:column;gap:8px}
.level-top{display:flex;justify-content:space-between;align-items:baseline}
.level-name{font-size:1.25rem;font-weight:700;color:var(--gold-primary)}
.week{padding:16px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:120px;margin-top:12px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:30px;border-radius:8px 8px 3px 3px;background:var(--gold-gradient);min-height:3px;opacity:.7;transition:height .6s var(--ease,ease)}
.bar.today{opacity:1;box-shadow:0 0 14px var(--gold-accent)}
.bar-val{font-size:.65rem;color:var(--text-muted)}
.bar-lbl{font-size:.68rem;color:var(--text-muted)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.ach{padding:12px 8px;text-align:center;border-radius:14px;border:1px solid var(--border-color);background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:3px;align-items:center}
.ach .ic{font-size:1.6rem}
.ach b{font-size:.8rem}
.ach small{font-size:.68rem;color:var(--text-muted);line-height:1.3}
.ach.locked{filter:grayscale(1);opacity:.4}
.history-section{padding:16px;display:flex;flex-direction:column;gap:10px}
.history-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.history-item{background:rgba(255,255,255,.04);border:1px solid var(--border-color);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem}
.history-item-arabic{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic','Scheherazade New',serif;font-size:1.05rem;color:var(--gold-primary)}
.history-item-time{font-size:.7rem;color:var(--text-muted)}
.history-item-badge{background:rgba(255,255,255,.07);color:var(--gold-accent);padding:3px 9px;border-radius:15px;font-weight:600;font-size:.74rem;white-space:nowrap}

/* ================= PRAYER TIMES ================= */
.prayer-card{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:.2s}
.prayer-card:hover{border-color:var(--gold-accent);box-shadow:0 0 18px var(--glow-color)}
.pc-ic{font-size:1.6rem}
.pc-main{flex:1;min-width:0}
.pc-label{font-size:.72rem;color:var(--text-muted)}
.pc-name{font-size:1.15rem;font-weight:700;color:var(--gold-primary)}
.pc-side{text-align:end}
.pc-time{font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums}
.pc-cd{font-size:.78rem;color:var(--gold-accent);font-variant-numeric:tabular-nums;direction:ltr}
.p-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;font-size:.95rem}
.p-row.next{background:var(--gold-gradient);color:#000;font-weight:700;box-shadow:0 0 16px var(--glow-color)}
.p-row.sun{opacity:.6;font-size:.85rem}
.p-row span:last-child{font-variant-numeric:tabular-nums}
#p-table{display:flex;flex-direction:column;gap:4px}
.pv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px}
.pv-city{font-size:1.15rem;font-weight:700;color:var(--gold-primary)}
.pv-empty{padding:24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.sun-card{padding:12px 10px 14px}
#sun-svg{width:100%;height:auto;display:block;direction:ltr;overflow:visible}
.sun-read{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sr-box{border:1px solid var(--border-color);border-radius:14px;padding:9px 6px;text-align:center;background:rgba(255,255,255,.03)}
.sr-v{font-weight:700;font-size:1.05rem;color:var(--gold-primary);font-variant-numeric:tabular-nums;direction:ltr}
.sr-l{font-size:.68rem;color:var(--text-muted);margin-top:2px}
.pv-next{padding:16px;text-align:center}
.pv-nn{font-size:1.7rem;font-weight:700;background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pv-nt{font-size:1rem;color:var(--text-muted)}
.pv-cd{font-size:2rem;font-weight:700;color:var(--gold-accent);font-variant-numeric:tabular-nums;direction:ltr}
.p-row.past{opacity:.45}
.adj-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.adj-row label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--text-muted)}
.adj-row input{background:rgba(255,255,255,.06);border:1px solid var(--border-color);border-radius:8px;padding:6px;width:100%;font-size:.9rem;text-align:center}
#p-table{padding:10px}
.coord-row{display:flex;gap:8px}
.coord-row .field{flex:1}

/* ================= SETTINGS ================= */
.settings-card{padding:16px;display:flex;flex-direction:column;gap:16px}
.setting-item{display:flex;justify-content:space-between;align-items:center;gap:12px}
.setting-label{font-size:.95rem;font-weight:500}
.theme-select{background:var(--bg-secondary);border:1px solid var(--border-color);color:var(--text-main);padding:7px 12px;border-radius:10px;font-size:.85rem}
.swatches{display:flex;gap:10px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--border-color);transition:.2s}
.swatch.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 14px var(--glow-color)}
.switch{width:48px;height:27px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid var(--border-color);position:relative;padding:0;flex:none}
.switch::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:21px;height:21px;border-radius:50%;background:var(--text-muted);transition:.25s}
.switch[aria-checked=true]{background:var(--gold-gradient)}
.switch[aria-checked=true]::after{inset-inline-start:23px;background:#111}
.about{font-size:.8rem;color:var(--text-muted);line-height:1.7}
.danger{border-color:rgba(255,90,90,.5)!important;color:#ff8c8c!important}

/* ================= NAV ================= */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:linear-gradient(transparent,var(--bg-secondary) 40%);border-top:1px solid var(--border-color);display:flex;justify-content:space-around;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:100;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav-item{display:flex;flex-direction:column;align-items:center;background:none;border:none;color:var(--text-muted);font-size:.7rem;gap:2px;transition:.25s;padding:4px 8px;position:relative;font-weight:600}
.nav-item.active{color:var(--gold-accent)}
.nav-item.active::before{content:'';position:absolute;top:-9px;width:26px;height:3px;border-radius:2px;background:var(--gold-gradient);box-shadow:0 0 10px var(--gold-accent)}
.nav-icon{font-size:1.3rem;transition:transform .25s}
.nav-item.active .nav-icon{transform:translateY(-2px) scale(1.12)}

/* ================= MODALS / TOASTS ================= */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;padding:16px}
.overlay.show{opacity:1;visibility:visible}
.modal-card{background:var(--bg-secondary);border:2px solid var(--gold-accent);border-radius:22px;padding:24px;text-align:center;max-width:360px;width:100%;box-shadow:0 0 50px var(--glow-color);animation:popUp .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popUp{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:1.5rem;font-weight:700;background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.modal-desc{color:var(--text-muted);font-size:.92rem;line-height:1.6;margin-bottom:18px}
.modal-row{display:flex;gap:10px}
.modal-row>*{flex:1}
.field{display:flex;flex-direction:column;gap:4px;text-align:start;margin-bottom:12px}
.field label{font-size:.78rem;color:var(--text-muted)}
.field input,.field textarea{background:rgba(255,255,255,.06);border:1px solid var(--border-color);border-radius:10px;padding:10px 12px;font-size:.95rem;outline:none;width:100%}
.field input:focus{border-color:var(--gold-accent)}
.preset-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.btn-primary{background:var(--gold-gradient);color:#000;border:none;padding:11px 20px;border-radius:12px;font-weight:700;font-size:.95rem;transition:.2s}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-ghost{background:none;border:1px solid var(--border-color);padding:11px 20px;border-radius:12px;font-weight:600;font-size:.95rem;color:var(--gold-primary)}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;z-index:1500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--bg-secondary);border:1px solid var(--gold-accent);color:var(--gold-primary);padding:10px 18px;border-radius:24px;font-size:.88rem;font-weight:600;box-shadow:0 0 24px var(--glow-color);animation:toastIn .4s var(--ease,ease),toastOut .4s 2.8s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}


/* ================= DUAS ================= */
.duas-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dua-tile{position:relative;overflow:hidden;min-height:124px;padding:14px 16px;border-radius:20px;border:1px solid var(--border-color);background:linear-gradient(155deg,var(--glow-color),transparent 78%),var(--bg-card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:flex-start;text-align:start;color:var(--gold-primary);font-weight:700;font-size:1.05rem;line-height:1.35;transition:.25s;animation:tileIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.dua-tile.wide{grid-column:1/-1;min-height:132px}
.dua-tile svg{position:absolute;inset-block-start:12px;inset-inline-end:12px;width:64px;height:64px;color:var(--gold-accent);opacity:.55;transition:.3s;pointer-events:none}
.dua-tile.wide svg{width:88px;height:88px}
.dua-tile span{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px}
.dua-tile small{font-size:.7rem;color:var(--text-muted);font-weight:600}
.dua-tile:hover{border-color:var(--gold-accent);transform:translateY(-2px);box-shadow:0 6px 22px var(--glow-color)}
.dua-tile:hover svg{opacity:.8}
.dua-tile:active{transform:scale(.97)}
.dua-tile:active svg{transform:scale(1.08) rotate(-4deg);opacity:.95}
@keyframes tileIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.dr-head{display:flex;align-items:center;gap:10px}
.dr-title{flex:1;font-weight:700;color:var(--gold-primary);font-size:1.08rem}
.dr-count{font-size:.8rem;color:var(--text-muted);font-variant-numeric:tabular-nums;direction:ltr}
.dr-dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dr-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.14);transition:.3s}
.dr-dot.seen{background:var(--glow-color);box-shadow:0 0 0 1px var(--border-color)}
.dr-dot.on{background:var(--gold-accent);width:22px;border-radius:4px;box-shadow:0 0 8px var(--gold-accent)}
#dua-card{touch-action:pan-y}
#dua-tr{font-size:.8rem;line-height:1.6;opacity:.8;margin-top:2px;direction:ltr}
.arabic-text.xl{font-size:1.3rem;line-height:1.95}
.why-box{margin-top:14px;padding:12px 14px;border-radius:16px;border:1px solid var(--border-color);background:linear-gradient(135deg,var(--glow-color),transparent 85%),rgba(255,255,255,.03);text-align:start}
.why-h{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--gold-accent);margin-bottom:5px}
.why-h svg{width:15px;height:15px}
.why-t{font-size:.88rem;line-height:1.8;color:var(--text-main)}
.dr-ctrl{display:flex;gap:10px;align-items:center;justify-content:center}
.dr-ctrl .icon-btn{width:46px;height:46px;font-size:1.15rem;flex:none}
.ameen{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;font-size:1.05rem;border-radius:16px;box-shadow:0 0 18px var(--glow-color)}
.ameen:active{transform:scale(.96)}

/* ================= PRAYER CHECK-IN ================= */
.track-card{padding:14px 12px 14px;position:relative;overflow:hidden;transition:box-shadow .5s,border-color .5s}
.track-card.all{border-color:var(--gold-accent);box-shadow:0 0 30px var(--glow-color),0 10px 30px rgba(0,0,0,.28)}
.tk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px 12px}
.tk-title{font-weight:700;color:var(--gold-primary);font-size:1.05rem}
.tk-frac{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold-accent);direction:ltr;font-size:.95rem}
.tk-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tk-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 0;color:var(--text-muted);font-size:.7rem;font-weight:600;transition:color .3s;-webkit-user-select:none;user-select:none}
.tk-btn.done{color:var(--gold-primary)}
.tk-circ{width:clamp(48px,14.5vw,64px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border-color);background:rgba(255,255,255,.04);color:var(--gold-primary);position:relative;transition:background .35s,border-color .35s,color .35s,box-shadow .35s,transform .15s}
.tk-circ>svg{width:54%;height:54%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s cubic-bezier(.175,.885,.32,1.275)}
.tk-btn:active .tk-circ{transform:scale(.88)}
.tk-btn.next .tk-circ{border-color:var(--gold-accent);animation:tkPulse 2.2s ease-out infinite}
@keyframes tkPulse{0%{box-shadow:0 0 0 0 var(--glow-color)}70%{box-shadow:0 0 0 13px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tk-btn.done .tk-circ{background:var(--gold-gradient);border-color:transparent;color:#14110a;box-shadow:0 0 20px var(--glow-color);animation:tkPop .55s cubic-bezier(.175,.885,.32,1.275)}
.tk-btn.done .tk-circ>svg{transform:scale(1.08)}
@keyframes tkPop{0%{transform:scale(.8)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
.tk-chk{position:absolute;inset-block-end:-5px;inset-inline-end:-5px;width:23px;height:23px;border-radius:50%;background:var(--bg-secondary);border:2px solid var(--gold-accent);color:var(--gold-accent);display:grid;place-items:center;transform:scale(0);transition:transform .35s cubic-bezier(.175,.885,.32,1.275) .08s}
.tk-chk svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.tk-chk path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s ease .22s}
.tk-btn.done .tk-chk{transform:scale(1)}
.tk-btn.done .tk-chk path{stroke-dashoffset:0}
.tk-ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--gold-accent);pointer-events:none;animation:tkRing .7s ease-out forwards}
@keyframes tkRing{to{transform:scale(1.9);opacity:0}}
.tk-week{display:flex;justify-content:space-between;gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-color)}
.tk-d{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.64rem;color:var(--text-muted)}
.tk-d i{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:conic-gradient(var(--gold-accent) var(--p,0%),rgba(255,255,255,.08) 0);position:relative}
.tk-d i::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--bg-secondary)}
.tk-d i b{position:relative;font-size:.7rem;font-weight:700;color:var(--gold-accent)}
.tk-d.today{color:var(--gold-primary);font-weight:700}
.tk-d.full i{box-shadow:0 0 10px var(--glow-color)}

/* ================= COLOR WHEEL ================= */
.swatches{flex-wrap:wrap;justify-content:flex-end}
.swatch.rainbow{position:relative;background:conic-gradient(from 0deg,#ff3b3b,#ffb300,#e7ff1f,#2ee86b,#19d4ff,#4a6bff,#b04dff,#ff3bd4,#ff3b3b);box-shadow:0 0 0 1px var(--border-color),0 0 10px rgba(255,255,255,.14)}
.swatch.rainbow:hover{transform:rotate(45deg) scale(1.1)}
.swatch.rainbow.on{transform:scale(1.15)}
.swatch.rainbow i{position:absolute;inset:6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.45)}
.wheel-card{max-width:340px}
.wheel-wrap{position:relative;isolation:isolate;width:min(250px,68vw);aspect-ratio:1;margin:8px auto 18px;border-radius:50%;touch-action:none;cursor:crosshair;box-shadow:0 0 34px var(--glow-color),0 0 0 3px rgba(255,255,255,.07)}
.wheel-wrap::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(#ff3b3b,#ffb300,#e7ff1f,#2ee86b,#19d4ff,#4a6bff,#b04dff,#ff3bd4,#ff3b3b);opacity:.4;filter:blur(9px);animation:spin 14s linear infinite;z-index:-1}
#wheel-cv{width:100%;height:100%;display:block;border-radius:50%}
.wheel-thumb{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.55),0 0 18px currentColor;pointer-events:none;transition:transform .15s}
.wheel-wrap.drag .wheel-thumb{transform:scale(1.2)}
.wheel-bar{height:8px;border-radius:5px;background:var(--gold-gradient);box-shadow:0 0 14px var(--glow-color);margin-bottom:16px}
.wheel-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:.82rem;color:var(--text-muted)}
#wheel-v{-webkit-appearance:none;appearance:none;direction:ltr;flex:1;height:10px;border-radius:6px;background:linear-gradient(90deg,#1a1a1a,var(--wc,#fff));border:1px solid var(--border-color);outline:none}
#wheel-v::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--gold-accent);box-shadow:0 0 10px var(--glow-color)}
#wheel-v::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--gold-accent);box-shadow:0 0 10px var(--glow-color)}
.wheel-hex{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.wheel-dot{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 16px var(--glow-color);flex:none}
.wheel-hex input{flex:1;min-width:0;text-align:center;direction:ltr;letter-spacing:2px;font-weight:700;text-transform:uppercase;background:rgba(255,255,255,.06);border:1px solid var(--border-color);border-radius:10px;padding:10px;outline:none;font-size:.95rem}
.wheel-hex input:focus{border-color:var(--gold-accent)}
@media (min-width:900px){
 .duas-grid{grid-template-columns:repeat(4,1fr)}
 .dua-tile.wide{grid-column:1/-1}
 .track-card{max-width:620px}
}

/* ================= DESKTOP: distinct layout ================= */
@media (min-width:900px){
 #app{max-width:1120px;padding-inline-start:104px}
 header{border-radius:0 0 20px 20px;padding-inline:24px}
 .view{padding:28px 24px 40px}
 .home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-areas:"a c";gap:24px;align-items:start}
 .g-c{position:sticky;top:96px}
 .arabic-text{font-size:2.6rem}
 .counter-ring-wrapper{width:300px}
 .count-display{font-size:4.6rem}
 .library-grid{display:grid;grid-template-columns:1fr 1fr}
 .me-list{display:grid;grid-template-columns:1fr 1fr}
 .stats-grid{grid-template-columns:repeat(4,1fr)}
 nav{top:0;bottom:0;left:auto;transform:none;inset-inline-start:0;width:88px;max-width:none;flex-direction:column;justify-content:flex-start;gap:14px;padding:90px 0 0;border-top:none;border-inline-end:1px solid var(--border-color);background:var(--bg-secondary)}
 .nav-item{font-size:.72rem;padding:10px 4px;width:100%}
 .nav-item.active::before{top:50%;inset-inline-end:0;width:3px;height:30px;margin-top:-15px}
 #toasts{top:84px}
}
</style>

<body>

<canvas id="cosmos"></canvas>
<div class="nebula" aria-hidden="true"></div>
<canvas id="fx"></canvas>

<!-- ============ SPLASH (4 seconds) ============ -->
<div id="splash-screen" aria-hidden="true">
  <svg class="splash-star" viewBox="-50 -50 100 100">
    <g class="s1" fill="none" style="stroke:var(--gold-accent)" stroke-width="1.1">
      <rect x="-30" y="-30" width="60" height="60"/>
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)"/>
    </g>
    <g class="s2" fill="none" style="stroke:var(--gold-primary)" stroke-width=".8" opacity=".8">
      <rect x="-20" y="-20" width="40" height="40"/>
      <rect x="-20" y="-20" width="40" height="40" transform="rotate(45)"/>
      <circle r="9"/>
    </g>
    <circle r="2.6" style="fill:var(--gold-accent)"/>
  </svg>
  <div class="splash-logo">ذِكْر</div>
  <div class="splash-sub">DHIKRVERSE</div>
  <div class="splash-ayah">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</div>
  <div class="loader-bar-container"><div class="loader-bar-fill" id="loader-fill"></div></div>
</div>

<!-- ============ MODALS ============ -->
<div class="overlay" id="celebration-modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-title" data-i18n="done_t"></div>
    <div class="modal-desc" id="modal-desc"></div>
    <div class="modal-row">
      <button class="btn-ghost" id="modal-keep-btn" data-i18n="keep"></button>
      <button class="btn-primary" id="modal-continue-btn" data-i18n="new_s"></button>
    </div>
  </div>
</div>

<div class="overlay" id="dlg" role="alertdialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-desc" id="dlg-msg" style="margin-bottom:20px;color:var(--text-main)"></div>

      <button class="btn-ghost" id="dlg-no" data-i18n="no"></button>
      <button class="btn-primary" id="dlg-ok" data-i18n="yes"></button>
    </div>
  </div>
</div>

<div class="overlay" id="add-modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-title" data-i18n="add_t"></div>
    <div class="field"><label for="add-text" data-i18n="f_text"></label><textarea id="add-text" rows="2" maxlength="200" style="resize:none"></textarea></div>
    <div class="field"><label for="add-tr" data-i18n="f_tr"></label><input id="add-tr" maxlength="120"></div>
    <div class="field"><label for="add-target" data-i18n="f_target"></label><input id="add-target" type="number" min="0" max="100000" value="0" inputmode="numeric"></div>
    <div class="modal-row">
      <button class="btn-ghost" id="add-cancel" data-i18n="cancel"></button>
      <button class="btn-primary" id="add-save" data-i18n="save"></button>

<div class="overlay" id="target-modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-title" data-i18n="tgt_t"></div>
    <div class="preset-row" id="preset-row"></div>
    <div class="field"><input id="target-input" type="number" min="0" max="100000" inputmode="numeric" aria-label="target"></div>
    <div class="modal-row">
      <button class="btn-ghost" id="target-cancel" data-i18n="cancel"></button>
      <button class="btn-primary" id="target-apply" data-i18n="apply"></button>
    </div>
  </div>
</div>

<div class="overlay" id="prayer-modal" role="dialog" aria-modal="true">
  <div class="modal-card" style="text-align:start;max-height:92vh;overflow:auto">
    <div class="modal-title" style="text-align:center" data-i18n="p_loc_t"></div>
    <div class="field"><label for="p-city" data-i18n="p_city"></label><select class="theme-select" id="p-city"></select></div>
    <button class="action-btn" id="p-gps" style="width:100%;justify-content:center;margin-bottom:12px">📍 <span data-i18n="p_loc"></span></button>
    <div class="coord-row">
      <div class="field"><label for="p-lat" data-i18n="p_lat"></label><input id="p-lat" type="number" step="0.0001" min="-90" max="90" inputmode="decimal"></div>

    <button class="btn-primary" id="p-close" style="width:100%;margin-top:14px" data-i18n="close"></button>
  </div>
</div>

<div class="overlay" id="wheel-modal" role="dialog" aria-modal="true">
  <div class="modal-card wheel-card">
    <div class="modal-title" data-i18n="w_title"></div>
    <div class="wheel-wrap" id="wheel-wrap">
      <canvas id="wheel-cv"></canvas>
      <div class="wheel-thumb" id="wheel-thumb"></div>
    </div>
    <div class="wheel-bar"></div>
    <div class="wheel-row"><span data-i18n="w_bright"></span><input type="range" id="wheel-v" min="50" max="100" value="100" aria-label="brightness"></div>
    <div class="wheel-hex"><span class="wheel-dot" id="wheel-dot"></span><input id="wheel-hex" maxlength="7" autocomplete="off" spellcheck="false" aria-label="hex"></div>
    <div class="modal-row">
      <button class="btn-ghost" id="wheel-cancel" data-i18n="cancel"></button>
      <button class="btn-primary" id="wheel-apply" data-i18n="apply"></button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="app-title">DHIKRVERSE</div>

 "duas": [
  {"id":"d1","cat":"quran","ar":"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ","tr":"Rabbana atina fid-dunya hasanah wa fil-akhirati hasanah wa qina adhaban-nar","en":"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","whyAr":"كان أكثر دعاء النبي ﷺ، وهو دعاء جامع لخيري الدنيا والآخرة.","whyEn":"It was the Prophet’s ﷺ most frequent supplication, and it gathers the good of this life and the next.","src":"القرآن الكريم — البقرة ٢٠١ · صحيح البخاري ومسلم"},
  {"id":"d2","cat":"quran","ar":"رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا","tr":"Rabbana la tu'akhidhna in nasina aw akhta'na","en":"Our Lord, do not hold us accountable if we forget or make a mistake.","whyAr":"من آخر آيتين من سورة البقرة، وقد أخبر النبي ﷺ أن من قرأ بهما في ليلة كفتاه.","whyEn":"From the last two verses of Surat al-Baqarah, of which the Prophet ﷺ said that whoever recites them at night, they will suffice him.","src":"القرآن الكريم — البقرة ٢٨٦ · صحيح البخاري ومسلم"},
  {"id":"d3","cat":"quran","ar":"رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ","tr":"Rabbana zalamna anfusana wa in lam taghfir lana wa tarhamna lanakunanna minal-khasireen","en":"Our Lord, we have wronged ourselves; if You do not forgive us and have mercy on us, we will surely be among the losers.","whyAr":"دعاء آدم وحواء عليهما السلام بعد الخطأ؛ فيه الاعتراف بالذنب وطلب المغفرة والرحمة.","whyEn":"The supplication of Adam and Hawwa (peace be upon them) after their mistake: admitting fault and asking for forgiveness and mercy.","src":"القرآن الكريم — الأعراف ٢٣"},
  {"id":"d4","cat":"quran","ar":"لَا إِلَهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ","tr":"La ilaha illa anta subhanaka inni kuntu minaz-zalimeen","en":"There is no deity but You; glory be to You. Indeed, I have been among the wrongdoers.","whyAr":"أخبر النبي ﷺ أنه ما دعا بها مسلم في أمر قط إلا استجاب الله له.","whyEn":"The Prophet ﷺ said that no Muslim ever supplicates with it about anything except that Allah answers him.","src":"القرآن الكريم — الأنبياء ٨٧ · سنن الترمذي"},
  {"id":"d5","cat":"quran","ar":"رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي","tr":"Rabbish-rah li sadri wa yassir li amri","en":"My Lord, expand my chest for me and ease my task for me.","whyAr":"دعاء موسى عليه السلام حين كُلِّف بمهمة عظيمة؛ يُطلب به انشراح الصدر وتيسير الأمور.","whyEn":"The supplication of Musa (peace be upon him) when given a great task; it asks for an open heart and ease in one’s affairs.","src":"القرآن الكريم — طه ٢٥–٢٦"},
  {"id":"d6","cat":"quran","ar":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً إِنَّكَ أَنتَ الْوَهَّابُ","tr":"Rabbana la tuzigh qulubana ba'da idh hadaytana wa hab lana min ladunka rahmah, innaka antal-Wahhab","en":"Our Lord, do not let our hearts deviate after You have guided us, and grant us mercy from Yourself; indeed You are the Bestower.","whyAr":"طلب الثبات على الهداية، وهو من دعاء الراسخين في العلم كما في سياق الآية.","whyEn":"A plea to remain firm on guidance, given in the verse’s context as the supplication of those firmly grounded in knowledge.","src":"القرآن الكريم — آل عمران ٨"},
  {"id":"d7","cat":"quran","ar":"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا","tr":"Rabbana hab lana min azwajina wa dhurriyyatina qurrata a'yunin waj'alna lil-muttaqina imama","en":"Our Lord, grant us from our spouses and offspring comfort to our eyes, and make us leaders for the righteous.","whyAr":"من صفات عباد الرحمن في سورة الفرقان؛ دعاء بصلاح الأسرة والذرية.","whyEn":"Among the qualities of the servants of the Most Merciful in Surat al-Furqan: a supplication for a righteous family.","src":"القرآن الكريم — الفرقان ٧٤"},
  {"id":"d8","cat":"quran","ar":"رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","tr":"Rabbir-hamhuma kama rabbayani saghira","en":"My Lord, have mercy upon them as they brought me up when I was small.","whyAr":"دعاء للوالدين، وقد ذكر النبي ﷺ أن من الأعمال التي لا ينقطع أجرها بعد الموت ولدًا صالحًا يدعو له.","whyEn":"A supplication for one’s parents. The Prophet ﷺ listed a righteous child who prays for him among what continues to benefit a person after death.","src":"القرآن الكريم — الإسراء ٢٤ · صحيح مسلم"},
  {"id":"d9","cat":"quran","ar":"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ","tr":"Rabbij'alni muqimas-salati wa min dhurriyyati, Rabbana wa taqabbal du'a","en":"My Lord, make me an establisher of prayer, and from my descendants. Our Lord, accept my supplication.","whyAr":"دعاء إبراهيم عليه السلام بإقامة الصلاة له ولذريته وبقبول الدعاء.","whyEn":"The supplication of Ibrahim (peace be upon him) to establish prayer for himself and his descendants, and for his dua to be accepted.","src":"القرآن الكريم — إبراهيم ٤٠"},
  {"id":"d10","cat":"quran","ar":"رَبِّ زِدْنِي عِلْمًا","tr":"Rabbi zidni ilma","en":"My Lord, increase me in knowledge.","whyAr":"أمر الله نبيَّه ﷺ بهذا الدعاء في القرآن، ففيه طلب الزيادة في العلم النافع.","whyEn":"Allah instructed His Prophet ﷺ to say this in the Qur’an; it asks for more beneficial knowledge.","src":"القرآن الكريم — طه ١١٤"},
  {"id":"d11","cat":"nabawi","ar":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ","tr":"Allahumma anta Rabbi la ilaha illa anta, khalaqtani wa ana abduka, wa ana ala ahdika wa wa'dika mastata'tu, a'udhu bika min sharri ma sana'tu, abu'u laka bini'matika alayya, wa abu'u bidhanbi faghfir li, fa innahu la yaghfirudh-dhunuba illa anta","en":"O Allah, You are my Lord; there is no deity but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil I have done. I acknowledge Your favor upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.","whyAr":"سمّاه النبي ﷺ «سيد الاستغفار»، وأخبر أن من قاله موقنًا به في النهار فمات قبل أن يمسي، أو في الليل فمات قبل أن يصبح، فهو من أهل الجنة.","whyEn":"The Prophet ﷺ called it the master of seeking forgiveness, and said whoever says it with firm faith by day and dies before evening, or by night and dies before morning, is among the people of Paradise.","src":"صحيح البخاري"},
  {"id":"d12","cat":"nabawi","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى","tr":"Allahumma inni as'alukal-huda wat-tuqa wal-afafa wal-ghina","en":"O Allah, I ask You for guidance, piety, chastity and self-sufficiency.","whyAr":"من جوامع دعاء النبي ﷺ: هداية وتقوى وعفة وغنى النفس.","whyEn":"One of the Prophet’s ﷺ comprehensive supplications: guidance, piety, chastity and contentment.","src":"صحيح مسلم"},
  {"id":"d13","cat":"nabawi","ar":"اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي، وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي، وَأَصْلِحْ لِي آخِرَتِي الَّتِي فِيهَا مَعَادِي، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِي فِي كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِي مِنْ كُلِّ شَرٍّ","tr":"Allahumma aslih li deeniyal-ladhi huwa ismatu amri, wa aslih li dunyayal-lati fiha ma'ashi, wa aslih li akhiratil-lati fiha ma'adi, waj'alil-hayata ziyadatan li fi kulli khayr, waj'alil-mawta rahatan li min kulli sharr","en":"O Allah, set right my religion, which is the safeguard of my affairs; set right my worldly life, in which is my livelihood; set right my Hereafter, to which is my return; make life an increase for me in every good, and death a relief from every evil.","whyAr":"دعاء جامع لصلاح الدين والدنيا والآخرة، ثبت عن النبي ﷺ.","whyEn":"A comprehensive supplication for the soundness of religion, worldly life and the Hereafter, reported from the Prophet ﷺ.","src":"صحيح مسلم"},
  {"id":"d14","cat":"nabawi","ar":"اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي","tr":"Allahumma innaka afuwwun tuhibbul-afwa fa'fu anni","en":"O Allah, You are Pardoning and love to pardon, so pardon me.","whyAr":"علّمه النبي ﷺ لعائشة رضي الله عنها حين سألته ماذا تقول إن وافقت ليلة القدر.","whyEn":"The Prophet ﷺ taught it to Aisha (may Allah be pleased with her) when she asked what to say if she met Laylat al-Qadr.","src":"سنن الترمذي"},
  {"id":"d15","cat":"nabawi","ar":"يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ","tr":"Ya muqallibal-qulub thabbit qalbi ala deenik","en":"O Turner of hearts, make my heart firm upon Your religion.","whyAr":"كان النبي ﷺ يكثر من هذا الدعاء، وفيه طلب أعظم ما يحتاجه العبد: الثبات على الدين.","whyEn":"The Prophet ﷺ used to say this often; it asks for what a believer needs most: steadfastness in the religion.","src":"سنن الترمذي"},
  {"id":"d16","cat":"nabawi","ar":"رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ","tr":"Rabbighfir li wa tub alayya innaka antat-Tawwabur-Raheem","en":"My Lord, forgive me and accept my repentance; You are the Accepting of repentance, the Merciful.","whyAr":"قال ابن عمر رضي الله عنهما: كنا نعدّ للنبي ﷺ في المجلس الواحد مئة مرة أن يقول هذا الدعاء.","whyEn":"Ibn Umar (may Allah be pleased with them) said they used to count the Prophet ﷺ saying this a hundred times in a single sitting.","src":"سنن أبي داود والترمذي"},
  {"id":"d17","cat":"nabawi","ar":"اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا، وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا","tr":"Allahumma ati nafsi taqwaha, wa zakkaha anta khayru man zakkaha, anta waliyyuha wa mawlaha","en":"O Allah, grant my soul its piety and purify it; You are the best to purify it, You are its Guardian and Master.","whyAr":"من دعاء النبي ﷺ، وفيه طلب تقوى النفس وتزكيتها من الله وحده.","whyEn":"From the Prophet’s ﷺ supplications; it asks Allah alone for a pious and purified soul.","src":"صحيح مسلم"},
  {"id":"d18","cat":"nabawi","ar":"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ","tr":"Allahummak-fini bihalalika an haramik, wa aghnini bifadlika amman siwak","en":"O Allah, suffice me with what You have made lawful instead of what You have forbidden, and make me independent of all besides You by Your bounty.","whyAr":"ذكر عليّ رضي الله عنه أن النبي ﷺ علّمه هذا الدعاء لأداء الدَّين ولو كان عظيمًا.","whyEn":"Ali (may Allah be pleased with him) reported that the Prophet ﷺ taught it for settling debt, even a great one.","src":"سنن الترمذي"},
  {"id":"d19","cat":"kurb","ar":"لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ","tr":"La ilaha illallahul-Azeemul-Haleem, la ilaha illallahu Rabbul-arshil-azeem, la ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-arshil-kareem","en":"None has the right to be worshipped but Allah, the Mighty, the Forbearing; none but Allah, Lord of the Mighty Throne; none but Allah, Lord of the heavens, Lord of the earth and Lord of the Noble Throne.","whyAr":"كان النبي ﷺ يدعو بها عند الكرب.","whyEn":"The Prophet ﷺ used to supplicate with it in times of distress.","src":"صحيح البخاري ومسلم"},
  {"id":"d20","cat":"kurb","ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","tr":"Allahumma inni a'udhu bika minal-hammi wal-hazan, wal-ajzi wal-kasal, wal-bukhli wal-jubn, wa dala'id-dayni wa ghalabatir-rijal","en":"O Allah, I seek refuge in You from worry and grief, from incapacity and laziness, from miserliness and cowardice, and from the burden of debt and being overpowered by men.","whyAr":"كان النبي ﷺ يدعو به، كما رواه أنس رضي الله عنه.","whyEn":"The Prophet ﷺ used to supplicate with it, as narrated by Anas (may Allah be pleased with him).","src":"صحيح البخاري"},
  {"id":"d21","cat":"kurb","ar":"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ","tr":"Hasbunallahu wa ni'mal-wakeel","en":"Allah is sufficient for us, and He is the best Disposer of affairs.","whyAr":"قالها إبراهيم عليه السلام حين أُلقي في النار، وقالها محمد ﷺ حين قيل له إن الناس قد جمعوا لكم (عن ابن عباس).","whyEn":"Ibrahim (peace be upon him) said it when thrown into the fire, and Muhammad ﷺ said it when told that the people had gathered against them (from Ibn Abbas).","src":"القرآن الكريم — آل عمران ١٧٣ · صحيح البخاري"},
  {"id":"d22","cat":"kurb","ar":"اللَّهُمَّ رَحْمَتَكَ أَرْجُو فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَهَ إِلَّا أَنْتَ","tr":"Allahumma rahmataka arju fala takilni ila nafsi tarfata ayn, wa aslih li sha'ni kullah, la ilaha illa anta","en":"O Allah, it is Your mercy that I hope for, so do not leave me to myself even for the blink of an eye, and set right all my affairs; there is no deity but You.","whyAr":"ورد عن النبي ﷺ ضمن دعوات المكروب.","whyEn":"Reported from the Prophet ﷺ among the supplications of one in distress.","src":"سنن أبي داود"},
  {"id":"d23","cat":"afterprayer","ar":"أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ. اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ","tr":"Astaghfirullah (x3). Allahumma antas-salam wa minkas-salam, tabarakta ya dhal-jalali wal-ikram","en":"I seek Allah’s forgiveness (three times). O Allah, You are Peace and from You comes peace; blessed are You, O Possessor of majesty and honor.","whyAr":"كان النبي ﷺ إذا انصرف من صلاته استغفر ثلاثًا ثم قال هذا الدعاء (حديث ثوبان رضي الله عنه).","whyEn":"When the Prophet ﷺ finished his prayer he sought forgiveness three times, then said this (hadith of Thawban, may Allah be pleased with him).","src":"صحيح مسلم"},
  {"id":"d24","cat":"afterprayer","ar":"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ","tr":"Allahumma a'inni ala dhikrika wa shukrika wa husni ibadatik","en":"O Allah, help me to remember You, to thank You, and to worship You in the best manner.","whyAr":"أوصى النبي ﷺ معاذًا رضي الله عنه ألا يدع قوله دبر كل صلاة.","whyEn":"The Prophet ﷺ advised Muadh (may Allah be pleased with him) never to leave saying it after every prayer.","src":"سنن أبي داود والنسائي"},
  {"id":"d25","cat":"afterprayer","ar":"اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ","tr":"Allahumma la mani'a lima a'tayta, wa la mu'tiya lima mana'ta, wa la yanfa'u dhal-jaddi minkal-jadd","en":"O Allah, none can withhold what You give, none can give what You withhold, and no wealth or status benefits its owner against You.","whyAr":"كان النبي ﷺ يقوله دبر كل صلاة مكتوبة ضمن ذكره (حديث المغيرة بن شعبة رضي الله عنه).","whyEn":"The Prophet ﷺ used to say it after every obligatory prayer as part of his remembrance (hadith of al-Mughira ibn Shu'ba).","src":"صحيح البخاري ومسلم"},
  {"id":"d26","cat":"mosque","ar":"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ","tr":"Allahummaf-tah li abwaba rahmatik","en":"O Allah, open for me the doors of Your mercy.","whyAr":"أمر النبي ﷺ أن يقولها من دخل المسجد.","whyEn":"The Prophet ﷺ instructed whoever enters the mosque to say it.","src":"صحيح مسلم"},
  {"id":"d27","cat":"mosque","ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ","tr":"Allahumma inni as'aluka min fadlik","en":"O Allah, I ask You of Your bounty.","whyAr":"أمر النبي ﷺ أن يقولها من خرج من المسجد.","whyEn":"The Prophet ﷺ instructed whoever leaves the mosque to say it.","src":"صحيح مسلم"},
  {"id":"d28","cat":"wake","ar":"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ","tr":"Alhamdu lillahil-ladhi ahyana ba'da ma amatana wa ilayhin-nushur","en":"All praise is for Allah who gave us life after causing us to die, and to Him is the resurrection.","whyAr":"كان النبي ﷺ يقولها إذا استيقظ من نومه (حديث حذيفة رضي الله عنه).","whyEn":"The Prophet ﷺ used to say it upon waking from sleep (hadith of Hudhayfah, may Allah be pleased with him).","src":"صحيح البخاري"},
  {"id":"d29","cat":"wake","ar":"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لِي بِذِكْرِهِ","tr":"Alhamdu lillahil-ladhi afani fi jasadi, wa radda alayya ruhi, wa adhina li bidhikrih","en":"All praise is for Allah who gave me well-being in my body, returned my soul to me, and permitted me to remember Him.","whyAr":"ورد عن النبي ﷺ أن يقولها المسلم إذا استيقظ؛ شكرٌ لله على العافية وعودة الروح.","whyEn":"Reported from the Prophet ﷺ to be said upon waking; it thanks Allah for well-being and the return of the soul.","src":"سنن الترمذي"},
  {"id":"d30","cat":"sleep","ar":"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا","tr":"Bismika Allahumma amutu wa ahya","en":"In Your name, O Allah, I die and I live.","whyAr":"كان النبي ﷺ يقولها إذا أخذ مضجعه (حديث حذيفة رضي الله عنه).","whyEn":"The Prophet ﷺ used to say it when he lay down to sleep (hadith of Hudhayfah, may Allah be pleased with him).","src":"صحيح البخاري"},
  {"id":"d31","cat":"sleep","ar":"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ","tr":"Allahumma qini adhabaka yawma tab'athu ibadak","en":"O Allah, protect me from Your punishment on the day You resurrect Your servants.","whyAr":"كان النبي ﷺ إذا أراد أن يرقد وضع يده اليمنى تحت خدّه ثم قال ذلك (حديث حفصة رضي الله عنها).","whyEn":"When the Prophet ﷺ wished to sleep he placed his right hand under his cheek and said this (hadith of Hafsah, may Allah be pleased with her).","src":"سنن أبي داود والترمذي"},
  {"id":"d32","cat":"sleep","ar":"بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ","tr":"Bismika Rabbi wada'tu janbi, wa bika arfa'uh, fa in amsakta nafsi farhamha, wa in arsaltaha fahfazha bima tahfazu bihi ibadakas-salihin","en":"In Your name, my Lord, I lay down my side and by You I raise it. If You take my soul, have mercy on it; and if You release it, protect it as You protect Your righteous servants.","whyAr":"علّمه النبي ﷺ أمّته عند النوم (حديث أبي هريرة رضي الله عنه).","whyEn":"The Prophet ﷺ taught it to his Ummah for bedtime (hadith of Abu Hurayrah, may Allah be pleased with him).","src":"صحيح البخاري ومسلم"},
  {"id":"d33","cat":"travel","ar":"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ","tr":"Subhanal-ladhi sakhkhara lana hadha wa ma kunna lahu muqrineen, wa inna ila Rabbina lamunqalibun","en":"Glory to Him who has subjected this to us, and we could never have done it ourselves; and to our Lord we will surely return.","whyAr":"كان النبي ﷺ إذا استوى على راحلته للسفر كبّر ثلاثًا ثم قال هذا الدعاء (حديث ابن عمر رضي الله عنهما).","whyEn":"When the Prophet ﷺ mounted his animal for a journey he said takbir three times, then this supplication (hadith of Ibn Umar).","src":"القرآن الكريم — الزخرف ١٣–١٤ · صحيح مسلم"},
  {"id":"d34","cat":"travel","ar":"اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى","tr":"Allahumma inna nas'aluka fi safarina hadhal-birra wat-taqwa, wa minal-amali ma tarda","en":"O Allah, we ask You on this journey of ours for righteousness and piety, and for deeds that please You.","whyAr":"من تتمة دعاء السفر الذي كان يقوله النبي ﷺ.","whyEn":"Part of the travel supplication the Prophet ﷺ used to say.","src":"صحيح مسلم"},
  {"id":"d35","cat":"travel","ar":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ","tr":"A'udhu bikalimatillahit-tammati min sharri ma khalaq","en":"I seek refuge in the perfect words of Allah from the evil of what He has created.","whyAr":"قال النبي ﷺ: من نزل منزلًا ثم قال هذا لم يضرّه شيء حتى يرتحل من منزله ذلك.","whyEn":"The Prophet ﷺ said that whoever stops at a place and says this, nothing will harm him until he leaves that place.","src":"صحيح مسلم"},
  {"id":"d36","cat":"ruqyah","ar":"أَذْهِبِ الْبَأْسَ رَبَّ النَّاسِ، وَاشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا","tr":"Adhhibil-ba'sa Rabban-nas, washfi antash-Shafi, la shifa'a illa shifa'uk, shifa'an la yughadiru saqama","en":"Remove the harm, O Lord of mankind, and heal, for You are the Healer; there is no healing except Your healing, a healing that leaves no illness.","whyAr":"كان النبي ﷺ يرقي به المريض (حديث عائشة رضي الله عنها).","whyEn":"The Prophet ﷺ used to recite it over the sick (hadith of Aisha, may Allah be pleased with her).","src":"صحيح البخاري ومسلم"},
  {"id":"d37","cat":"ruqyah","ar":"بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِيكَ، بِسْمِ اللَّهِ أَرْقِيكَ","tr":"Bismillahi arqik, min kulli shay'in yu'dhik, min sharri kulli nafsin aw aynin hasid, Allahu yashfik, bismillahi arqik","en":"In the name of Allah I perform ruqyah for you, from everything that harms you, from the evil of every soul or envious eye; may Allah heal you. In the name of Allah I perform ruqyah for you.","whyAr":"هي رقية جبريل عليه السلام للنبي ﷺ (حديث أبي سعيد الخدري رضي الله عنه).","whyEn":"This is the ruqyah of Jibril (peace be upon him) for the Prophet ﷺ (hadith of Abu Said al-Khudri).","src":"صحيح مسلم"},
  {"id":"d38","cat":"ruqyah","ar":"بِسْمِ اللَّهِ (ثَلَاثًا)، أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ (سَبْعَ مَرَّاتٍ)","tr":"Bismillah (x3). A'udhu billahi wa qudratihi min sharri ma ajidu wa uhadhir (x7)","en":"In the name of Allah (three times). I seek refuge in Allah and His power from the evil of what I feel and fear (seven times).","whyAr":"علّمه النبي ﷺ لمن اشتكى ألمًا في جسده: يضع يده على موضع الألم ويقوله (حديث عثمان بن أبي العاص رضي الله عنه).","whyEn":"The Prophet ﷺ taught whoever feels pain in his body to place a hand on the spot and say this (hadith of Uthman ibn Abi al-As).","src":"صحيح مسلم"},
  {"id":"d39","cat":"ruqyah","ar":"أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ","tr":"As'alullahal-Azeema Rabbal-arshil-azeemi an yashfiyak","en":"I ask Allah the Mighty, Lord of the Mighty Throne, to heal you.","whyAr":"قال النبي ﷺ: من عاد مريضًا لم يحضر أجله فقال عنده سبع مرات هذا الدعاء عافاه الله من ذلك المرض (حديث ابن عباس رضي الله عنهما).","whyEn":"The Prophet ﷺ said that whoever visits a sick person whose time has not come and says this seven times, Allah will cure him of that illness (hadith of Ibn Abbas).","src":"سنن أبي داود والترمذي"}

let audioCtx = null, master = null, verb = null, lastTapAt = 0;
function ac(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 18; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .2;
    master = audioCtx.createGain(); master.gain.value = .9;
    master.connect(comp); comp.connect(audioCtx.destination);
    /* soft shimmer room, generated once */
    const len = Math.floor(audioCtx.sampleRate * 1.6), ir = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
    for(let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 2.6); }
    verb = audioCtx.createConvolver(); verb.buffer = ir;
    const wet = audioCtx.createGain(); wet.gain.value = .32; verb.connect(wet); wet.connect(master);
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
/* one decaying voice; o.wet = amount sent to the reverb, o.glide = pitch slide target */
function voice(freq, at, dur, type, vol, o){
  o = o || {};
  const a = ac(), t0 = a.currentTime + at, osc = a.createOscillator(), g = a.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  if(o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + (o.atk || .006));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(master);
  if(o.wet){ const s = a.createGain(); s.gain.value = o.wet; g.connect(s); s.connect(verb); }
  osc.start(t0); osc.stop(t0 + dur + .05);
}
/* bell = inharmonic partials, higher ones fade faster */
function bell(freq, at, vol, dur){
  [[1,1],[2.01,.42],[2.76,.28],[4.07,.12],[5.4,.07]].forEach((p, i) => voice(freq*p[0], at, (dur || 1.2)/(1 + i*.35), 'sine', vol*p[1], {wet:.9, atk:.003}));
}
function noiseHit(at, dur, freq, q, vol){
  const a = ac(), len = Math.max(8, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 3);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(master); src.start(a.currentTime + at);
}
function sfx(kind){
  if(!S.sound) return;
  try{
    ac();
    if(kind === 'tap'){
      const now = performance.now(); if(now - lastTapAt < 25) return; lastTapAt = now;
      const j = .94 + Math.random()*.12;                       /* tiny pitch variation so fast counting never sounds robotic */
      noiseHit(0, .04, 1900*j, 1.6, .55);                      /* wooden bead */
      voice(260*j, 0, .09, 'sine', .22, {glide:105*j, atk:.002});
      voice(1250*j, 0, .035, 'triangle', .05, {atk:.001, wet:.4});
    } else if(kind === 'mile'){
      bell(659.25, 0, .2, 1.4); bell(987.77, .08, .12, 1.1);
    } else if(kind === 'done'){
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => bell(f, i*.1, .17, 1.7));
      voice(130.81, 0, 1.4, 'sine', .14, {atk:.05, wet:.5});
      voice(261.63, .02, 1.4, 'triangle', .06, {atk:.08, wet:.6});
    } else if(kind === 'ach'){
      bell(880, 0, .16, 1); bell(1318.5, .12, .14, 1.2); bell(1760, .24, .1, 1.4);
    } else if(kind === 'lvl'){
      [392, 523.25, 659.25, 784].forEach((f, i) => bell(f, i*.09, .15, 1.3));
    } else if(kind === 'ui'){
      noiseHit(0, .02, 3200, 2, .12); voice(900, 0, .05, 'sine', .04, {glide:600, atk:.002});
    }
  }catch(e){}
}

/* ---------- cosmos canvas + particles ---------- */
const bg = $('cosmos'), bctx = bg.getContext('2d'), fx = $('fx'), fctx = fx.getContext('2d');
let W=0,H=0,DPR=1,stars=[],shoot=null,nextShoot=0,px=0,py=0,tx=0,ty=0,parts=[],loopOn=false;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#d4af37';
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  [bg,fx].forEach(c => { c.width = W*DPR; c.height = H*DPR; });
  bctx.setTransform(DPR,0,0,DPR,0,0); fctx.setTransform(DPR,0,0,DPR,0,0);
  const n = Math.min(Math.round(W*H/8500), 230);
  stars = Array.from({length:n}, (_,i) => ({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.9+.1,tw:Math.random()*6.28,sp:Math.random()*1.4+.4,acc:i%8===0}));
  if(isRM()) drawBg(0);
}
function drawBg(now){
  bctx.clearRect(0,0,W,H);
  const acc = cssVar('--gold-accent');
  px += (tx-px)*.05; py += (ty-py)*.05;
  for(const s of stars){
    const a = isRM() ? .5*s.z+.15 : (.3 + .7*(.5+.5*Math.sin(now/1000*s.sp+s.tw)))*s.z;
    bctx.globalAlpha = a; bctx.fillStyle = s.acc ? acc : '#fff';
    const x = s.x + px*s.z*18, y = s.y + py*s.z*18;
    bctx.beginPath(); bctx.arc(x, y, s.z*1.5+.2, 0, 6.283); bctx.fill();
  }
  bctx.globalAlpha = 1;
  if(!isRM()){
    if(!shoot && now > nextShoot){
      const sx = Math.random()*W*.8, sy = Math.random()*H*.4;
      shoot = {x:sx,y:sy,vx:9+Math.random()*5,vy:4+Math.random()*3,life:0};
      nextShoot = now + 5000 + Math.random()*6000;
    }
    if(shoot){
      shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.life++;
      const g = bctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx*9, shoot.y - shoot.vy*9);
      g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
      bctx.strokeStyle = g; bctx.lineWidth = 1.6; bctx.beginPath();
      bctx.moveTo(shoot.x, shoot.y); bctx.lineTo(shoot.x - shoot.vx*9, shoot.y - shoot.vy*9); bctx.stroke();
      if(shoot.life > 55 || shoot.x > W+60 || shoot.y > H+60) shoot = null;
    }
  }
}
function starPath(c, r){
  c.beginPath();
  for(let i=0;i<16;i++){ const rr = i%2 ? r*.45 : r, a = i*Math.PI/8; c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  c.closePath();
}
function burst(x, y, n, o){
  if(isRM()) return;
  o = o || {};
  const cols = [cssVar('--gold-accent'), cssVar('--gold-primary'), '#ffffff'];
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, s = (o.speed||2.4)*(.35+Math.random());
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(o.up||0),g:o.g||.05,life:0,max:(o.life||38)+Math.random()*22,
      size:(o.size||2.2)*(.6+Math.random()),rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,star:!!o.star,c:cols[(Math.random()*3)|0]});

function drawFx(){
  fctx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life++; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if(p.life > p.max){ parts.splice(i,1); continue; }
    fctx.globalAlpha = 1 - p.life/p.max; fctx.fillStyle = p.c;
    fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.rot);
    if(p.star){ starPath(fctx, p.size*2.6); fctx.fill(); } else { fctx.beginPath(); fctx.arc(0,0,p.size,0,6.283); fctx.fill(); }

  }

}
function frame(now){
  if(isRM() && !parts.length && Math.abs(beadPos - S.count) < .001){ loopOn = false; fctx.clearRect(0,0,W,H); return; }
  if(!isRM()) drawBg(now);
  drawFx(); stepBeads();
  requestAnimationFrame(frame);
}
function startLoop(){ if(!loopOn){ loopOn = true; requestAnimationFrame(frame); } }

/* ---------- beads (SVG tasbeeh arc) ---------- */
const beadGroup = $('bead-group'), NB = 15, beadEls = [];
for(let i=0;i<NB;i++){
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  const h = document.createElementNS('http://www.w3.org/2000/svg','circle');
  h.setAttribute('fill','#fff'); h.setAttribute('opacity','.5');
  g.appendChild(c); g.appendChild(h); beadGroup.appendChild(g); beadEls.push({g,c,h});
}
let beadPos = S.count;
function drawBeads(pos){
  const base = Math.floor(pos), frac = pos - base, half = (NB-1)/2;
  for(let k=-half;k<=half;k++){
    const idx = base + k, p = k - frac, ap = Math.min(Math.abs(p), half);
    const imam = (((idx % 33) + 33) % 33) === 0;
    const r = (imam ? 15 : 11) * (1 - ap/half*.4);
    const x = p*36, y = 12 + x*x/1296;
    const e = beadEls[k+half];
    e.c.setAttribute('cx',x); e.c.setAttribute('cy',y); e.c.setAttribute('r',r.toFixed(2));
    e.c.setAttribute('fill', imam ? 'url(#gSilver)' : 'url(#gGold)');
    e.h.setAttribute('cx',(x-r*.3).toFixed(2)); e.h.setAttribute('cy',(y-r*.35).toFixed(2)); e.h.setAttribute('r',(r*.26).toFixed(2));
    e.g.setAttribute('opacity', Math.max(0, 1 - Math.pow(ap/(half+.6), 2)*.95).toFixed(2));
  }
}
function stepBeads(){
  if(isRM()){ beadPos = S.count; drawBeads(beadPos); return; }
  const d = S.count - beadPos;
  if(Math.abs(d) < .001){ beadPos = S.count; } else { beadPos += d*.28; }
  drawBeads(beadPos);
}

function tap(x, y){

  const tg = S.target; let kind = 'tap';
  if(tg > 0 && S.count === tg && !S.sessionDone){ kind = 'done'; completeSession(); }
  else if(S.count % 33 === 0) kind = 'mile';

/* ---------- color wheel ---------- */
let wheelOpen = false, wheelDrawn = 0, wheelRaf = 0, wheelC = {h:210, s:.85, v:1};
function drawWheel(){
  const wrap = $('wheel-wrap'), size = Math.round(wrap.clientWidth * Math.min(window.devicePixelRatio || 1, 2));
  if(!size || wheelDrawn === size) return;

  for(let y = 0; y < size; y++) for(let x = 0; x < size; x++){
    const dx = x + .5 - R, dy = y + .5 - R, r = Math.sqrt(dx*dx + dy*dy); if(r > R) continue;
    let h = Math.atan2(dy, dx) * 180/Math.PI; if(h < 0) h += 360;
    const [rr,gg,bb] = hsv2rgb(h, Math.min(1, r/R), 1), i = (y*size + x)*4;
    d[i] = rr; d[i+1] = gg; d[i+2] = bb; d[i+3] = Math.min(255, (R - r)*255);

  const hex = hexOf(wheelC), full = toHex(...hsv2rgb(wheelC.h, wheelC.s, 1));
